name: Production guard (self-heal)

# =====================================================================
# WHY THIS EXISTS — 2026-08-12
# Two working copies deploy to this Cloudflare Pages project with
# `wrangler pages deploy`. One of them deployed a tree that predated the
# CSS/JS split and silently replaced production with a build missing ~684
# commits: the owner's corrected 90.4% same-day-discharge figure, the
# Preclinical Fellowship line, the fellowship tense fix, the reel-autoplay
# fix and every clinical-modal rewrite disappeared from the live site.
# Desktop browsers kept serving the good build from cache, so it went
# unnoticed and surfaced only when the owner opened the site on a phone.
#
# The stale-tree gate in deploy-prod.sh protects only a working copy that
# has PULLED it. This workflow closes the hole unconditionally: it watches
# the LIVE site from GitHub's infrastructure and repairs it from main.
#
# DESIGN RULES (learned the hard way — the first version emailed the owner
# a failure every 20 minutes while production was perfectly healthy):
#   * NEVER fail on a healthy site. A red run must mean something real.
#   * A single bad fetch is NOT a regression. verify_production.py retries
#     before it will say so, because saying so triggers a redeploy.
#   * If the Cloudflare secrets are absent, say that plainly instead of
#     dying with an opaque "exit code 1" — a missing secret is a setup
#     problem, not a site problem, and must not masquerade as one.
#   * Every outcome writes a job summary, so the notification explains
#     itself without anyone opening logs.
# =====================================================================

on:
  schedule:
    # 2026-08-13 — was '7,27,47 * * * *': SEVENTY-TWO runs a day. The
    # header below already records that an earlier version emailed the
    # owner every 20 minutes while production was healthy; running it 72
    # times a day meant any flake at all reproduced that experience.
    #
    # Twice daily is the right cadence for what this actually guards
    # against: a second working copy deploying a stale tree. That is a
    # rare, human-triggered event, not a continuous risk — and
    # deploy-prod.sh now carries its own stale-tree gate, so this is the
    # backstop rather than the primary defence. Two checks a day bound
    # the exposure to hours, which is the same order as the original
    # incident's detection time, at 1/36th the noise.
    - cron: '17 13,1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  # Never let two guards restore at once, and never queue a backlog.
  group: production-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    name: Verify production, restore if it has regressed
    steps:
      - name: Checkout main (the single source of truth)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Retries live inside the script, so a transient blip cannot trigger
      # a redeploy. `set +e` keeps a non-zero exit from failing the step —
      # the exit code is the SIGNAL here, not an error.
      - name: Check the live site
        id: canary
        run: |
          set +e
          # 2026-08-14 — retries raised from 3/20s. The owner deploys
          # directly with deploy-prod.sh, sometimes several times in an
          # hour, and a fetch that lands mid-deploy sees the old build for
          # a few seconds. That is not a regression, but the canary could
          # not tell the difference and emailed him about it. Five spaced
          # attempts outlast any single deploy's edge propagation.
          python3 scripts/verify_production.py --retries 5 --retry-delay 30 | tee canary.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Healthy — nothing to do
        if: steps.canary.outputs.status == '0'
        run: |
          echo "✅ production is serving the current build."
          {
            echo "## ✅ Production healthy"
            echo ""
            echo "The live site is serving the current build. No action taken."
          } >> "$GITHUB_STEP_SUMMARY"

      # A missing secret is a SETUP problem. Report it as itself rather than
      # letting deploy-prod.sh exit 1 with an opaque message.
      - name: Confirm deploy credentials are available
        id: creds
        if: steps.canary.outputs.status != '0'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare secrets are not configured; cannot auto-restore."
          fi

      - name: Restore production from main
        id: restore
        continue-on-error: true   # never skip the explanation step below
        if: steps.canary.outputs.status != '0' && steps.creds.outputs.have == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@4 >/dev/null 2>&1 || true
          # deploy-prod.sh stages an explicitly filtered copy (docs/,
          # wrangler.toml and .env* never ship) and runs the full gate suite.
          ./scripts/deploy-prod.sh "AUTO-RESTORE: production had regressed to a stale build"

      - name: Re-verify after restore
        id: reverify
        continue-on-error: true
        if: steps.canary.outputs.status != '0' && steps.creds.outputs.have == '1'
        run: |
          echo "Waiting for the edge to pick up the restore…"
          sleep 45
          python3 scripts/verify_production.py --retries 3 --retry-delay 20

      # One place that explains the outcome, whatever it was.
      - name: Explain the outcome
        if: steps.canary.outputs.status != '0'
        run: |
          {
            echo "## 🛑 Production had regressed"
            echo ""
            echo "The live site was serving a build that is missing published work —"
            echo "the signature of a working copy deploying an out-of-date tree."
            echo ""
            if [ "${{ steps.creds.outputs.have }}" = "1" ] \
                 && [ "${{ steps.restore.outcome }}" = "success" ] \
                 && [ "${{ steps.reverify.outcome }}" = "success" ]; then
              echo "It was **automatically restored from \`main\`** and re-verified."
            elif [ "${{ steps.creds.outputs.have }}" = "1" ]; then
              echo "**The automatic restore did NOT succeed**"
              echo "(restore: \`${{ steps.restore.outcome }}\`,"
              echo "re-verify: \`${{ steps.reverify.outcome }}\`)."
              echo "Restore by hand from an up-to-date copy:"
              echo '```'
              echo "git pull --ff-only origin main && ./scripts/deploy-prod.sh 'restore'"
              echo '```'
            else
              echo "**It could NOT be restored**: the \`CLOUDFLARE_API_TOKEN\` /"
              echo "\`CLOUDFLARE_ACCOUNT_ID\` repository secrets are not configured."
              echo "Add them in Settings → Secrets and variables → Actions."
            fi
            echo ""
            echo "### Fix the cause"
            echo "On the machine that deployed the old tree:"
            echo '```'
            echo "git pull --ff-only origin main"
            echo '```'
            echo ""
            echo "### What the canary saw"
            echo '```'
            cat canary.log 2>/dev/null | head -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # EXIT CODE POLICY — this is what was emailing the owner.
          #
          # The header of this file lays down two rules: "NEVER fail on a
          # healthy site. A red run must mean something real", and "a
          # missing secret is a setup problem, not a site problem, and must
          # not masquerade as one". The code then warned about the missing
          # secret AND exited 1 anyway, which is precisely that masquerade:
          # a red run, and an email, for a condition the notification
          # cannot help him fix and that says nothing about the site.
          #
          # A red run now means one thing only: this workflow COULD act and
          # the restore did not work. That is real and actionable. Every
          # other outcome writes the job summary and exits green — the
          # information is still there for anyone who looks, without paging
          # him about it.
          if [ "${{ steps.creds.outputs.have }}" != "1" ]; then
            echo "::warning::Production looks stale, but the Cloudflare secrets are not configured so this workflow cannot restore it. Not failing the run — see the job summary."
            exit 0
          fi
          if [ "${{ steps.restore.outcome }}" = "success" ] \
               && [ "${{ steps.reverify.outcome }}" = "success" ]; then
            echo "::notice::Production had regressed and was restored automatically."
            exit 0
          fi
          echo "::error::Production regressed and the automatic restore FAILED — see the job summary."
          exit 1
