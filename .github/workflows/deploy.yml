name: Deploy to Cloudflare Pages

# =====================================================================
# MANUAL ONLY — 2026-08-13
#
# This job used to run on every push to main. It failed in ~10 seconds on
# each one and emailed the owner about it, which is how a CI signal stops
# meaning anything.
#
# It is also REDUNDANT. CLAUDE.md is explicit that deploys go through
# ./scripts/deploy-prod.sh from an authenticated working copy, and calls
# deploy-on-push an anti-pattern for this repo. That script runs the same
# hermetic gates this job runs, plus the live-site audits CI cannot do
# (no browser, no credentials), plus a production canary afterwards. So
# the push trigger added no protection the real deploy path lacks — only
# noise.
#
# Kept as workflow_dispatch so it can still be run deliberately from the
# Actions tab if a deploy is ever needed without a working copy. To put
# the push trigger back, restore the `push:` block below — but fix the
# underlying failure first, because an always-red job is worse than none.
# =====================================================================

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 2026-07-28 — the repo's hermetic gates (no network, no browser, no
      # creds) now also guard the CI path, so a push to main can never
      # deploy content that the local deploy-prod.sh stack would block:
      # canonical post-format tests, the fact-sync gate (false/private info),
      # and the hero-animation lock.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fact-sync gate (canonical facts, privacy exclusions)
        run: node scripts/audit_fact_sync.mjs
      - name: Canonical post-format gate (hermetic fixtures)
        run: node scripts/test_post_format_gate.mjs
      - name: Hero animation lock
        run: node scripts/hero_anim_fingerprint.mjs --check

      # §0.4.1 pre-deploy static-surface regression audit (added 2026-05-27).
      # Closes the "git push main bypasses the local deploy-prod.sh gate"
      # vector identified by the 2026-05-27 audit. The local
      # scripts/deploy-prod.sh runs regression_audit.py --all as a
      # blocking gate, but a `git push main` does NOT exercise that
      # script — Pages-action just deploys whatever is checked in.
      #
      # In CI we can't auth against admin /api/posts/_admin (no Keychain),
      # so we run inline static-pattern checks on every surface that's
      # about to be deployed: education pages, portal mirrors, the
      # /evidence/ and /trending/ shells, and the admin SPAs. Any §3.7
      # infra-language, §1.2 bare MIGS, §3.10 blue tokens, §3.12
      # missing-disclaimer, or §0.2.2 DOCTYPE wrap on those files fails
      # the deploy. Emergency bypass: set DEPLOY_SKIP_REGRESSION_AUDIT
      # repo variable to a non-empty reason string.
      - name: §0.4.1 pre-deploy regression-audit gate (static surfaces)
        env:
          DEPLOY_SKIP_REGRESSION_AUDIT: ${{ vars.DEPLOY_SKIP_REGRESSION_AUDIT }}
        run: |
          set -eu
          if [ -n "${DEPLOY_SKIP_REGRESSION_AUDIT:-}" ]; then
            echo "!! §0.4.1 gate SKIPPED via DEPLOY_SKIP_REGRESSION_AUDIT"
            echo "!! reason: $DEPLOY_SKIP_REGRESSION_AUDIT"
            echo "!! THIS IS AUDITABLE — bypass only with explicit reason"
            exit 0
          fi

          FAILS=0
          # §3.7 infra-language — the exact list from
          # regression_audit.py INFRA_LANGUAGE (kept in sync 2026-05-26)
          # Use grep -F for fixed strings; § needs literal match.
          FORBIDDEN_PHRASES=(
            'MountZara KB'
            'MountZara clinical KB'
            'MountZara clinical knowledge base'
            'Mount Zara KB'
            'Mount Zara clinical KB'
            'clinical knowledge base'
            'in this session'
            'NCBI E-Utilities'
            'KB-anchored'
            'CBG/MIGS evidence library'
            'KB landmark PMID'
            '(KB landmark'
            'Already in KB'
          )
          # §3.10 blue color tokens (NOT used on mountzara.com)
          BLUE_TOKENS='(#0066cc|#0a84ff|#3b82f6|#2563eb|rgba\(0, 102, 204|rgba\(10, 132, 255|rgba\(59, 130, 246)'

          # Static surfaces that are about to deploy
          SURFACES=()
          for f in education/*/index.html portal/education/*/index.html \
                   evidence/index.html trending/index.html \
                   index.html about/index.html; do
            [ -f "$f" ] && SURFACES+=("$f")
          done
          echo "scanning ${#SURFACES[@]} static surface(s) for §0.4.1 hard rules"
          echo

          for f in "${SURFACES[@]}"; do
            # §3.7 infra-language — must not appear in static prose
            for phrase in "${FORBIDDEN_PHRASES[@]}"; do
              if grep -qF -- "$phrase" "$f"; then
                # Education pages legitimately reference the rule §-numbers
                # in HTML comments (§0.8 manifest, etc.). Strip HTML
                # comments before the check so we only flag visible prose.
                visible=$(sed -e 's|<!--[^-]*-->||g' "$f")
                if echo "$visible" | grep -qF -- "$phrase"; then
                  echo "FAIL §3.7 infra-language in $f: '$phrase'"
                  FAILS=$((FAILS + 1))
                fi
              fi
            done
            # §3.10 blue token
            if grep -qE "$BLUE_TOKENS" "$f"; then
              hit=$(grep -oE "$BLUE_TOKENS" "$f" | head -1)
              echo "FAIL §3.10 blue token in $f: $hit"
              FAILS=$((FAILS + 1))
            fi
            # §3.12 disclaimer presence — required on clinical pages only
            # (education + portal/education). Skip the SPA shells.
            case "$f" in
              education/*|portal/education/*)
                if ! grep -qF -- 'mz-ai-disclaimer' "$f"; then
                  echo "FAIL §3.12 missing AI disclaimer on $f"
                  FAILS=$((FAILS + 1))
                fi
                ;;
            esac
          done

          # §0.4 forbidden generic hero phrase guard (catches W22-pattern
          # legacy auto-draft regressions in any static-rendered post)
          FORBIDDEN_HERO="What's new in CBG/MIGS, endometriosis, MHT, and adjacent topics this week"
          for f in "${SURFACES[@]}"; do
            if grep -qF -- "$FORBIDDEN_HERO" "$f"; then
              echo "FAIL §3.9 forbidden generic hero phrase in $f"
              FAILS=$((FAILS + 1))
            fi
          done

          # §10.3.1 admin-auth canonical resolver — refuse to deploy if
          # any operator script in this repo hard-codes ADMIN_USER='admin'
          if grep -REn "ADMIN_USER[[:space:]]*=[[:space:]]*['\"]admin['\"]" \
              scripts/ 2>/dev/null | grep -v '_lib_admin_auth' | head -5; then
            echo "FAIL §10.3.1 — operator script hard-codes ADMIN_USER='admin'"
            FAILS=$((FAILS + 1))
          fi

          # §0.2.2 — body_html files (if any are checked in directly)
          # must not have DOCTYPE wrap. (R2 posts are dynamic — this
          # only catches accidentally-checked-in body_html fragments.)
          for f in $(find . -name '*body_html*.html' 2>/dev/null); do
            head=$(head -c 200 "$f" | tr 'A-Z' 'a-z')
            if echo "$head" | grep -qE '<!doctype|<html|<body'; then
              echo "FAIL §0.2.2 — body_html fragment has DOCTYPE/html/body wrap: $f"
              FAILS=$((FAILS + 1))
            fi
          done

          echo
          if [ "$FAILS" -gt 0 ]; then
            echo "❌ §0.4.1 pre-deploy regression-audit: $FAILS HARD FAIL(S)"
            echo "Deploy BLOCKED — fix the underlying files before re-pushing."
            echo "Emergency bypass: set repository variable"
            echo "DEPLOY_SKIP_REGRESSION_AUDIT to a non-empty reason string."
            exit 1
          fi
          echo "✅ §0.4.1 pre-deploy regression-audit: PASS"
          echo "  ${#SURFACES[@]} static surfaces scanned, 0 hard fails"

      # 2026-08-12 — was `cloudflare/pages-action` with `directory: .`,
      # which uploads the ENTIRE repo root: docs/ (internal program
      # documents — the SFH risk-management letter, the PHI master-key
      # rotation runbook, billing go-live notes), wrangler.toml (leaks the
      # D1 database id and KV namespace ids), and any .env file. The local
      # deploy path has excluded those since 2026-06-29; CI did not, so a
      # push to main could publish material that a manual deploy never
      # would. Both paths now go through the one audited script, which
      # stages an explicitly filtered copy AND runs the full gate suite.
      # A missing secret is a SETUP problem and must say so. Pointing this
      # job at deploy-prod.sh made it exit 1 in ~10s with a bare "exit code
      # 1" whenever the Cloudflare credentials were absent — an opaque red X
      # on every single push, which trains everyone to ignore CI.
      - name: Check deploy credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python (gates are Python)
        if: steps.creds.outputs.have == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # DEPLOY_CI=1 keeps every hermetic content gate and skips only the
      # browser-driven live-site audits, which need Playwright browsers the
      # runner does not have — and which audit what is ALREADY published
      # rather than the tree being pushed. Staging stays filtered, so CI
      # still cannot publish docs/, wrangler.toml or .env*.
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.have == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_CI: '1'
        run: |
          npm install -g wrangler@4 >/dev/null 2>&1 || true
          ./scripts/deploy-prod.sh "CI: push to main"

      # Not a failure. The site is deployed directly from an authenticated
      # working copy; CI deploying is an ADDITIONAL path, not the only one.
      # Failing every push for a missing optional credential is noise.
      - name: Explain that CI deploy is not configured
        if: steps.creds.outputs.have != '1'
        run: |
          {
            echo "## ⏭️ CI deploy skipped — credentials not configured"
            echo ""
            echo "\`CLOUDFLARE_API_TOKEN\` and/or \`CLOUDFLARE_ACCOUNT_ID\` are not set"
            echo "as repository secrets, so this job cannot publish."
            echo ""
            echo "**The gates above still ran** — this push was validated."
            echo "The live site is unaffected: it is deployed from an"
            echo "authenticated working copy with \`./scripts/deploy-prod.sh\`."
            echo ""
            echo "To enable deploy-on-push, add both under"
            echo "Settings → Secrets and variables → Actions."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::CI deploy skipped — Cloudflare secrets not configured (see job summary)." 
