        .banner.wait{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.40);color:#fcd34d;}

        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:6px;}

        label.fld{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);margin:10px 0 6px;}
        select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;color:var(--fg-strong);font-size:14px;padding:10px 12px;font-family:inherit;}

/* 2026-07-28 — explicit plum canvas (theme-consistency sweep) */
html { background:
    radial-gradient(110vmax 80vmax at 82% -10%, rgba(139, 92, 246, 0.09), transparent 62%),

/* ===== 2026-08-08 accessibility pass (measured, not assumed) =====
   Audit found: contrast failures concentrated on translucent "light" panels,
   nav/footer links 15-20px tall, carousel pips 7x7px, and a skip link that
   itself failed contrast. WCAG 2.5.8 wants a 24x24 minimum target; 2.4.7
   wants a visible focus indicator; 1.4.3 wants 4.5:1 on body text. */
nav a, .site-nav a, .main-nav a, footer a, .foot a, .footer-content a,
.nav-back, .nav-brand, .brand, .crumb a {
    min-height: 24px;
    display: inline-flex;
    align-items: center;
}
/* Pips keep their small dot but get a real 24px hit area via padding. */
.mz-grid-pip, .carousel-pip, [class*="-pip"] {
    min-width: 24px;
    min-height: 24px;
    padding: 8px;
    background-clip: content-box;
    box-sizing: border-box;
}
.mobile-toggle, .nav-toggle, [class*="menu-toggle"] {
    min-width: 44px;
    min-height: 44px;
}
/* Focus must be visible on every interactive element, on any background. */
a:focus-visible, button:focus-visible, [role="button"]:focus-visible,
summary:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid #c4b5fd;
    outline-offset: 2px;
    border-radius: 6px;
}
/* The skip link was white on light purple (2.96:1). Dark plum ground = 13:1. */
.skip-link {
    background: #2e1065 !important;
    color: #ffffff !important;
    border: 1px solid #c4b5fd;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
    }
}

<body>
<!-- 2026-08-12 — page background art REMOVED from the admin backend at the
     owner's instruction ("remove the image background requirment - the
     missing image blue box is behind every page"). It rendered as a broken
     image on every admin page: /admin/* sends
     Cross-Origin-Embedder-Policy: require-corp, and the art was loaded from
     the APEX (https://mountzara.com/media/...) while the site is browsed on
     www — a cross-origin subresource that ships no
     Cross-Origin-Resource-Policy header, so COEP blocks it and the browser
     paints the placeholder box. Do not reintroduce a cross-origin image
     under /admin/. -->
            <script src="/admin/_nav.js"></script>
    <div class="wrap">
        <header class="bar"><span class="crumb"><a href="/admin/">Admin</a> › Membership</span></header>
        <h1>Membership <b>· Demand</b></h1>
        <p class="lede">The waitlist, and what it says. Membership is not open for enrolment — this is the evidence that decides what opens first, and whether it is worth opening at all.</p>

        <div id="root"><div class="center"><div class="spin"></div>Loading…</div></div>
    </div>

<script>
// =====================================================================
// Membership demand console
// =====================================================================
// Every number here is computed server-side in SQL and JavaScript. The
// page renders them; it does not derive them, and neither does the model.
// A business decision made on a hallucinated count is worse than no
// analysis at all, so the AI button asks for INTERPRETATION of finished
// arithmetic and never for the arithmetic itself.
// =====================================================================
(function () {
    "use strict";
    var API = "/api/v1/admin/membership/interest";
    var root = document.getElementById("root");
    var S = null;

    function esc(v) {
        return String(v == null ? "" : v)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function money(n) { return "$" + Math.round(Number(n) || 0).toLocaleString(); }
    function el(id) { return document.getElementById(id); }

    function load() {
        return fetch(API, { credentials: "same-origin" }).then(function (r) {
            if (r.status === 401) throw new Error("SIGNIN");
            return r.json();
        });
    }

    function post(action) {
        return fetch(API, {
            method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: action }),
        });
    }

    // "Before this opens" — pulled out of render() so the zero-signup branch
    // can show it too. It used to sit below an early return, which made the
    // one section worth reading on day one unreachable on day one.
    function complianceHtml(d) {
        if (!d.compliance || !d.compliance.length) return "";
        var h = '<section class="block"><h2>Before this opens</h2>';
        h += '<p class="muted" style="font-size:13px;line-height:1.6;margin-bottom:14px;">Shown on this page rather than buried in a document, because a compliance checklist nobody sees is not a control. This is not legal advice — it is the list to take to your healthcare attorney.</p>';
        d.compliance.forEach(function (c) {
            h += '<div class="cmp-item"><div class="t">' + esc(c.topic) + '</div><div class="n">' + esc(c.note) + "</div>";
            if (c.cite) h += '<div class="c">' + esc(c.cite) + "</div>";
            h += "</div>";
        });
        h += "</section>";
        return h;
    }

    function render(d) {
        S = d;
        var h = "";

        // ---- licence warnings first: they change what can be sold
        (d.licence_warnings || []).forEach(function (w) {
            h += '<div class="lic ' + esc(w.severity) + '">' + esc(w.message) + "</div>";
        });

        if (!d.total) {
            h += '<section class="block"><div class="empty">'
               + "No signups yet — nothing here is broken. The waitlist is live on the public portal page; "
               + "the compliance checklist below is worth reading before you open a tier."
               + "</div></section>";
            h += complianceHtml(d);
            root.innerHTML = h;
            return;
        }

        // ---- headline
        var proj = (d.projection && d.projection.at_assumed_conversion) || null;
        h += '<div class="kpis">';
        h += '<div class="kpi hot"><div class="l">On the list</div><div class="v">' + d.total + "</div></div>";
        h += '<div class="kpi"><div class="l">Outside IL / CA</div><div class="v">' + d.geography.out_of_state
           + '</div><div class="s">' + d.geography.out_of_state_pct + "% of signups</div></div>";
        h += '<div class="kpi"><div class="l">Already have an OB/GYN</div><div class="v">'
           + (d.obgyn.has + d.obgyn.none ? d.obgyn.has_pct + "%" : "—")
           + '</div><div class="s">' + d.obgyn.has + " yes · " + d.obgyn.none + " no · " + d.obgyn.unknown + " unsaid</div></div>";
        h += '<div class="kpi"><div class="l">At 15% conversion</div><div class="v">'
           + (proj ? money(proj.annual_margin) : "—")
           + '</div><div class="s">margin per year</div></div>';
        h += "</div>";

        // ---- tier demand
        h += '<section class="block"><h2>Which tier they want</h2>';
        var tiers = d.economics || [];
        var maxT = 1;
        tiers.forEach(function (t) { maxT = Math.max(maxT, d.by_tier[t.tier] || 0); });
        maxT = Math.max(maxT, d.by_tier.any || 0);
        h += '<div class="bars">';
        tiers.forEach(function (t) {
            var n = d.by_tier[t.tier] || 0;
            h += '<div class="bar-row"><span class="nm">' + esc(t.name) + " · $" + t.price_month + "</span>"
               + '<span class="tr"><i style="width:' + Math.round((n / maxT) * 100) + '%"></i></span>'
               + '<span class="ct">' + n + " (" + (d.total ? Math.round((n / d.total) * 100) : 0) + "%)</span>"
               + '<span class="mg">' + money(t.margin) + "/mo ea</span></div>";
        });
        var anyN = d.by_tier.any || 0;
        if (anyN) {
            h += '<div class="bar-row"><span class="nm">Not sure yet</span>'
               + '<span class="tr"><i style="width:' + Math.round((anyN / maxT) * 100) + '%;opacity:.45"></i></span>'
               + '<span class="ct">' + anyN + "</span><span class=\"mg\"></span></div>";
        }
        h += "</div>";
        h += '<div class="reads">The margin column is per member per month at the current prices. A tier that is popular AND high-margin is where the effort goes; a tier that is popular and thin is a pricing question, not a demand question.</div>';
        h += "</section>";

        // ---- geography
        h += '<section class="block"><h2>Where they are</h2>';
        h += '<div class="reads">' + esc(d.geography.reads) + "</div>";
        h += '<div class="scroll-x"><table class="tbl"><thead><tr><th>State</th><th>Signups</th><th>Can he consult there?</th></tr></thead><tbody>';
        (d.by_state || []).forEach(function (s) {
            h += "<tr><td class='nm'>" + esc(s.state) + "</td><td>" + s.count + "</td><td>"
               + (s.licensed ? '<span class="tag ok">Licensed</span>'
                             : '<span class="tag med">Preparation tools only</span>') + "</td></tr>";
        });
        h += "</tbody></table></div></section>";

        // ---- the Navigator thesis
        h += '<section class="block"><h2>Do they already have a doctor?</h2>';
        h += '<div class="reads">' + esc(d.obgyn.reads) + "</div>";
        h += '<p class="muted" style="font-size:13px;line-height:1.6;">This is the question Navigator was built on. If most signups already have an OB/GYN, the $59 tier is the product and the higher tiers are the upsell — and because it consumes none of his time, its panel has no ceiling. If most do not, they are looking for a surgeon, and Priority and Complete matter more than the thesis assumed.</p>';
        h += "</section>";

        // ---- trend
        var days = Object.keys(d.daily || {}).sort();
        if (days.length > 1) {
            var maxD = 1;
            days.forEach(function (k) { maxD = Math.max(maxD, d.daily[k]); });
            h += '<section class="block"><h2>Signups per day · last 30</h2><div class="spark">';
            days.forEach(function (k) {
                h += '<i style="height:' + Math.max(4, Math.round((d.daily[k] / maxD) * 100)) + '%" title="'
                   + esc(k) + ": " + d.daily[k] + '"></i>';
            });
            h += "</div><div class=\"spark-x\"><span>" + esc(days[0]) + "</span><span>" + esc(days[days.length - 1]) + "</span></div>";
            h += "</section>";
        }

        // ---- projection
        if (d.projection) {
            h += '<section class="block"><h2>What it would be worth</h2>';
            var full = d.projection.if_all_converted;
            h += '<div class="grid">';
            h += '<div class="tile"><div class="l">If everyone converted</div><div class="v">'
               + (full ? money(full.annual_margin) : "—") + '</div></div>';
            h += '<div class="tile"><div class="l">At 15% conversion</div><div class="v">'
               + (proj ? money(proj.annual_margin) : "—") + '</div></div>';
            h += '<div class="tile"><div class="l">Your time used</div><div class="v">'
               + (proj ? Math.round(proj.utilisation * 100) + "%" : "—") + '</div></div>';
            h += "</div>";
            h += '<div class="reads">' + esc(d.projection.note) + "</div>";
            ((proj && proj.warnings) || []).forEach(function (w) {
                h += '<div class="lic warning">' + esc(w) + "</div>";
            });
            h += "</section>";
        }

        // ---- AI read
        h += '<section class="block"><h2>What it means</h2>';
        h += '<div class="row"><button class="btn" id="ai-btn">Ask for a read</button>'
           + '<button class="btn ghost" id="csv-btn">Export CSV</button></div>';
        h += '<div class="result" id="ai-msg" style="display:none;"></div>';
        h += '<div id="ai-out"></div>';
        h += '<p class="muted" style="font-size:12.5px;margin-top:14px;line-height:1.6;">Every number above is computed from the database. The AI is handed those finished figures and asked to interpret them — it is never asked to count, because a decision made on a hallucinated count is worse than no analysis.</p>';
        h += "</section>";

        // ---- the list
        h += '<section class="block"><h2>The list · ' + d.total + "</h2>";
        h += '<div class="scroll-x"><table class="tbl"><thead><tr>'
           + "<th>When</th><th>Email</th><th>Tier</th><th>State</th><th>Has OB/GYN</th><th>Source</th></tr></thead><tbody>";
        (d.recent || []).forEach(function (r) {
            h += "<tr><td>" + esc((r.created_at || "").replace("T", " ").slice(0, 16)) + "</td>"
               + "<td class='nm'>" + esc(r.email) + "</td>"
               + "<td>" + esc(r.tier || "—") + "</td>"
               + "<td>" + esc(r.state || "—") + "</td>"
               + "<td>" + esc(r.has_obgyn || "—") + "</td>"
               + "<td>" + esc(r.source || "—") + "</td></tr>";
        });
        h += "</tbody></table></div>";
        if (d.total > (d.recent || []).length) {
            h += '<p class="muted" style="font-size:12.5px;margin-top:10px;">Showing the most recent ' + d.recent.length + " of " + d.total + ". Export the CSV for all of them.</p>";
        }
        h += "</section>";

        // ---- compliance, always visible
        h += complianceHtml(d);

        root.innerHTML = h;

        var btn = el("ai-btn");
        if (btn) btn.addEventListener("click", function () {
            btn.disabled = true; btn.textContent = "Thinking…";
            var msg = el("ai-msg");
            msg.style.display = "block";
            msg.textContent = "Sending the figures for interpretation…";
            post("analyze").then(function (r) { return r.json(); }).then(function (j) {
                btn.disabled = false; btn.textContent = "Ask for a read";
                if (j.skipped || j.unavailable || j.queued) {
                    msg.textContent = j.message;
                    return;
                }
                msg.style.display = "none";
                el("ai-out").innerHTML = '<div class="ai-out">' + esc(j.analysis || "") + "</div>";
            }).catch(function (e) {
                btn.disabled = false; btn.textContent = "Ask for a read";
                msg.textContent = "Could not get a read: " + e;
            });
        });

        var csv = el("csv-btn");
        if (csv) csv.addEventListener("click", function () {
            csv.disabled = true;
            post("export").then(function (r) { return r.text(); }).then(function (text) {
                csv.disabled = false;
                // Blob + object URL: the list can be long, and a data: URI
                // of a few thousand rows hits URL length limits in Safari.
                var blob = new Blob([text], { type: "text/csv;charset=utf-8" });
                var url = URL.createObjectURL(blob);
                var a = document.createElement("a");
                a.href = url; a.download = "membership-interest.csv";
                document.body.appendChild(a); a.click();
                document.body.removeChild(a);
                setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
            }).catch(function () { csv.disabled = false; });
        });
    }

    load().then(render).catch(function (err) {
        root.innerHTML = '<section class="block"><div class="center">'
            + (String(err).indexOf("SIGNIN") >= 0
                ? 'Sign in to continue. <a href="/admin/">Admin sign-in</a>'
                : "Could not load: " + esc(String(err)))
            + "</div></section>";
    });
})();
</script>
</body>
</html>
