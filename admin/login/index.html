<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noai, noimageai, nosnippet, noarchive">
    <title>Mount Zara — Admin sign-in</title>
    <link rel="icon" type="image/png" href="/assets/images/Black White Elegant Personal Monogram Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --white: #ffffff;
            --glow-purple: 139, 92, 246;
            --glow-purple-deep: 109, 40, 217;
            --text-on-dark: #f5f5f7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100vh; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background:
                radial-gradient(ellipse 50% 35% at 50% 30%, rgba(var(--glow-purple), 0.16), transparent 70%),
                radial-gradient(ellipse 40% 30% at 50% 80%, rgba(var(--glow-purple-deep), 0.12), transparent 70%),
                linear-gradient(180deg, #000000 0%, #0a0a0c 100%);
            color: var(--text-on-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-feature-settings: "ss01", "cv11";
            line-height: 1.5;
        }
        a { color: inherit; text-decoration: none; }

        .login-shell {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            color: var(--white);
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.08em;
            opacity: 0;
            transform: translateY(8px);
            animation: rise 700ms cubic-bezier(0.16, 1, 0.3, 1) 120ms forwards;
        }
        .brand img {
            height: 32px;
            width: auto;
            filter: brightness(0) invert(1);
            opacity: 0.92;
        }
        @keyframes rise {
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            width: 100%;
            padding: clamp(32px, 5vw, 44px) clamp(28px, 5vw, 40px) clamp(28px, 4vw, 36px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(36px) saturate(170%);
            -webkit-backdrop-filter: blur(36px) saturate(170%);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 22px;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 30px 80px -20px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(14px) scale(0.985);
            animation: rise 800ms cubic-bezier(0.16, 1, 0.3, 1) 220ms forwards;
        }
        .login-eyebrow {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(var(--glow-purple), 0.95);
            margin-bottom: 12px;
        }
        h1 {
            font-size: clamp(22px, 2.8vw, 28px);
            font-weight: 600;
            letter-spacing: -0.018em;
            line-height: 1.15;
            color: var(--white);
            margin-bottom: 8px;
        }
        .lede {
            font-size: 14.5px;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.62);
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 16px;
        }
        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 7px;
        }
        .field input {
            width: 100%;
            font-family: inherit;
            font-size: 15px;
            color: var(--white);
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 12px;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }
        .field input::placeholder { color: rgba(255, 255, 255, 0.30); }
        .field input:hover { background: rgba(255, 255, 255, 0.05); }
        .field input:focus {
            border-color: rgba(var(--glow-purple), 0.55);
            background: rgba(var(--glow-purple), 0.04);
            box-shadow: 0 0 0 3px rgba(var(--glow-purple), 0.18);
        }

        .submit {
            width: 100%;
            margin-top: 12px;
            padding: 14px 18px;
            font: 600 15px 'Inter', system-ui, sans-serif;
            color: var(--white);
            background: linear-gradient(180deg, rgba(var(--glow-purple), 0.95) 0%, rgba(var(--glow-purple-deep), 0.95) 100%);
            border: 1px solid rgba(var(--glow-purple), 0.5);
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.25s ease, filter 0.18s ease;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.18),
                0 14px 30px -12px rgba(var(--glow-purple-deep), 0.55);
        }
        .submit:hover:not(:disabled) {
            transform: translateY(-1px);
            filter: brightness(1.06);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                0 20px 40px -14px rgba(var(--glow-purple-deep), 0.65);
        }
        .submit:active:not(:disabled) { transform: translateY(0); filter: brightness(0.95); }
        .submit:disabled { opacity: 0.55; cursor: wait; }

        .error {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(255, 99, 99, 0.10);
            border: 1px solid rgba(255, 99, 99, 0.30);
            font-size: 13px;
            color: rgba(255, 180, 180, 0.95);
            display: none;
        }
        .error.show { display: block; }

        .meta {
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.35);
            text-align: center;
            line-height: 1.6;
            opacity: 0;
            animation: rise 800ms cubic-bezier(0.16, 1, 0.3, 1) 320ms forwards;
        }
        .meta a {
            color: rgba(255, 255, 255, 0.55);
            border-bottom: 1px dotted rgba(255, 255, 255, 0.20);
        }
        .meta a:hover { color: rgba(var(--glow-purple), 0.95); }
        .meta-row { margin: 4px 0; }
    
        /* Fixed finalized hero line-art backdrop (static — does NOT play) so the
           glass dashboard components frost against real texture, uniform with the
           rest of the site. Move the opaque page base to html so the z-index:-1
           art shows; body keeps only its translucent glow on top. Added 2026-06-29. */
        html { background-color: var(--bg-base, var(--bg, var(--black, #07070a))); }
        body { background-color: transparent !important; }
        .page-bg-stage { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: #000; opacity: 0.75; }
        .page-bg-art { position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; object-fit: contain; pointer-events: none; filter: saturate(2.0) brightness(1.28) contrast(1.28); transform: translate(-48%, -50%) rotate(-22deg) scale(2.09); }
    </style>
</head>
<body>
    <div class="page-bg-stage" aria-hidden="true"><img class="page-bg-art" src="https://mountzara.com/media/hero-last-frame-v2.webp" alt=""></div>
    <main class="login-shell">
        <a href="/" class="brand">
            <img src="/assets/images/Black White Elegant Personal Monogram Logo.png" alt="Mount Zara">
            MOUNT ZARA
        </a>

        <form id="loginForm" class="login-card" autocomplete="on">
            <span class="login-eyebrow">Admin sign-in</span>
            <h1>Welcome back, Dr. Mabini.</h1>
            <p class="lede">Manage MIGS Monday Morning blog drafts, evidence briefs, and approvals.</p>

            <div class="field">
                <label class="field-label" for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="username"
                       value="chris.mabini@gmail.com" required
                       placeholder="chris.mabini@gmail.com">
            </div>

            <div class="field">
                <label class="field-label" for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                       required autofocus placeholder="••••••••••••">
            </div>

            <button type="submit" id="submit" class="submit">Sign in</button>

            <div class="error" id="error"></div>
        </form>

        <div class="meta">
            <div class="meta-row">Cloudflare-fronted · TLS 1.3 · PBKDF2-SHA256 password storage</div>
            <div class="meta-row">Trouble? <a href="/">Back to mountzara.com</a></div>
        </div>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const submit = document.getElementById('submit');
        const errorEl = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.remove('show');
            submit.disabled = true;
            submit.textContent = 'Signing in…';

            const email = form.email.value.trim();
            const password = form.password.value;
            try {
                const res = await fetch('/admin/api/login', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                if (res.ok) {
                    // Server set the session cookie. Redirect to wherever the user was going.
                    const params = new URLSearchParams(window.location.search);
                    const next = params.get('next') || '/admin/';
                    window.location.href = next;
                    return;
                }
                let msg = 'Invalid email or password.';
                try {
                    const data = await res.json();
                    if (data && data.error) msg = data.error;
                } catch {}
                errorEl.textContent = msg;
                errorEl.classList.add('show');
                form.password.value = '';
                form.password.focus();
            } catch (err) {
                errorEl.textContent = 'Network error. Check your connection and try again.';
                errorEl.classList.add('show');
            } finally {
                submit.disabled = false;
                submit.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
