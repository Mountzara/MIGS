<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Mount Zara — Admin Dashboard</title>
    <link rel="icon" type="image/png" href="/assets/images/mount-zara-monogram.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FBFAF8;
            --white: #1A1726;
            --gray-1: rgba(255, 255, 255, 0.72);
            --gray-2: rgba(255, 255, 255, 0.5);
            --gray-3: rgba(255, 255, 255, 0.3);
            --glow-purple: 139, 92, 246;
            --glow-purple-deep: 109, 40, 217;
            --status-draft: 255, 159, 10;
            --status-published: 52, 199, 89;
            --status-rejected: 255, 99, 99;
            --text-on-dark: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Avenir Next', 'Avenir', 'Nunito Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
            background: linear-gradient(180deg, #FBFAF8 0%, #F6F3EF 100%);
            color: var(--text-on-dark); min-height: 100vh; line-height: 1.5;
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }

        .nav {
            position: sticky; top: 0; z-index: 100;
            padding: 14px clamp(20px, 4vw, 36px);
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border-bottom: 1px solid #E9E5EE;
            display: flex; align-items: center; justify-content: space-between; gap: 24px;
        }
        .nav-left { display: inline-flex; align-items: center; gap: 16px; }
        .nav-brand { display: inline-flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; letter-spacing: 0.08em; color: #1A1726; }
        .nav-brand img { height: 28px; filter: brightness(0) invert(1); }
        .nav-admin-badge {
            font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
            color: #6d28d9; padding: 4px 10px;
            background: rgba(var(--glow-purple), 0.10); border: 1px solid rgba(var(--glow-purple), 0.28);
            border-radius: 999px;
        }
        .nav-user { font-size: 13px; color: #4A4658; }
        .nav-user-email { color: #4A4658; font-weight: 500; }

        .layout {
            display: grid; grid-template-columns: 380px 1fr;
            min-height: calc(100vh - 65px);
        }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

        .sidebar {
            border-right: 1px solid #E9E5EE;
            padding: 28px clamp(16px, 2vw, 24px);
            overflow-y: auto;
            max-height: calc(100vh - 65px);
        }
        .sidebar-section { margin-bottom: 32px; }
        .sidebar-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px;
        }
        .sidebar-title {
            font-size: 11px; font-weight: 700; letter-spacing: 0.22em;
            text-transform: uppercase; color: #6d28d9;
        }
        .sidebar-count {
            font-size: 11px; padding: 3px 9px; border-radius: 999px;
            background: rgba(255,255,255,0.72); color: #6E6A7C; font-weight: 600;
        }
        .kind-tabs { display: flex; gap: 6px; margin-bottom: 20px; }
        .kind-tab {
            flex: 1; padding: 10px 12px; border-radius: 10px;
            font-size: 13px; font-weight: 600; text-align: center;
            background: rgba(255,255,255,0.72);
            border: 1px solid #E9E5EE;
            color: #4A4658;
            transition: all 0.2s ease;
        }
        .kind-tab:hover { color: var(--white); background: rgba(255,255,255,0.72); }
        .kind-tab.active {
            color: #6d28d9;
            background: rgba(var(--glow-purple), 0.10);
            border-color: #6d28d9;
        }

        .post-list { display: flex; flex-direction: column; gap: 8px; }
        .post-item {
            padding: 14px 16px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid #E9E5EE;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .post-item:hover {
            background: rgba(255,255,255,0.72);
            border-color: #6d28d9;
        }
        .post-item.active {
            background: rgba(var(--glow-purple), 0.10);
            border-color: #6d28d9;
        }
        .post-item-row {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            margin-bottom: 6px;
        }
        .status-pill {
            display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: 0.16em;
            text-transform: uppercase; padding: 3px 9px; border-radius: 999px;
        }
        .status-draft     { color: rgba(var(--status-draft), 0.95);     background: rgba(var(--status-draft), 0.10);     border: 1px solid rgba(var(--status-draft), 0.30); }
        .status-published { color: rgba(var(--status-published), 0.95); background: rgba(var(--status-published), 0.10); border: 1px solid rgba(var(--status-published), 0.30); }
        .status-rejected  { color: rgba(var(--status-rejected), 0.85);  background: rgba(var(--status-rejected), 0.10);  border: 1px solid rgba(var(--status-rejected), 0.30); }
        .post-item-date { font-size: 11px; color: #6E6A7C; letter-spacing: 0.04em; }
        .post-item-title { font-size: 14px; font-weight: 600; color: #1A1726; line-height: 1.32; margin-bottom: 4px; }
        .post-item-summary { font-size: 12px; line-height: 1.5; color: #4A4658; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .empty-list {
            padding: 40px 20px; text-align: center;
            font-size: 13px; color: #4A4658;
            background: rgba(255,255,255,0.72);
            border: 1px dashed rgba(255, 255, 255, 0.10);
            border-radius: 12px;
        }

        .main {
            padding: 28px clamp(20px, 3vw, 40px);
            overflow-y: auto; max-height: calc(100vh - 65px);
        }
        .empty-main {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; min-height: 60vh;
            color: #4A4658; text-align: center; gap: 12px;
        }
        .empty-main h2 { font-size: 20px; font-weight: 500; color: #1A1726; }

        .detail-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
        .detail-meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
        .detail-title-row { flex: 1; min-width: 260px; }
        .detail-title { font-size: clamp(22px, 2.4vw, 30px); font-weight: 600; letter-spacing: -0.018em; line-height: 1.2; color: #1A1726; margin-bottom: 8px; }
        .detail-summary { font-size: 14.5px; line-height: 1.6; color: #4A4658; }
        .detail-actions {
            display: flex; gap: 10px; flex-wrap: wrap;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 18px; border-radius: 10px;
            font-size: 13.5px; font-weight: 600; letter-spacing: 0;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .btn-approve {
            color: rgba(var(--status-published), 0.95);
            background: rgba(var(--status-published), 0.10);
            border-color: rgba(var(--status-published), 0.30);
        }
        .btn-approve:hover { background: rgba(var(--status-published), 0.18); color: #fff; }
        .btn-reject {
            color: rgba(var(--status-rejected), 0.85);
            background: rgba(var(--status-rejected), 0.10);
            border-color: rgba(var(--status-rejected), 0.30);
        }
        .btn-reject:hover { background: rgba(var(--status-rejected), 0.18); color: #fff; }
        .btn-edit {
            color: #6d28d9;
            background: rgba(var(--glow-purple), 0.10);
            border-color: #6d28d9;
        }
        .btn-edit:hover { background: #6d28d9; color: #fff; }
        .btn-secondary {
            color: #ffffff;
            background: rgba(255,255,255,0.72);
            border-color: #E9E5EE;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .preview-toggle {
            display: inline-flex; gap: 6px; margin-bottom: 16px;
            background: rgba(255,255,255,0.72);
            border: 1px solid #E9E5EE;
            border-radius: 10px; padding: 4px;
        }
        .preview-toggle button {
            padding: 7px 14px; font-size: 12.5px; font-weight: 600; border-radius: 7px;
            color: #ffffff;
            transition: all 0.15s ease;
        }
        .preview-toggle button.active {
            color: var(--white);
            background: rgba(var(--glow-purple), 0.20);
        }

        .preview-frame {
            width: 100%; height: 70vh; min-height: 600px;
            border: 1px solid #E9E5EE;
            border-radius: 16px;
            background: #FBFAF8;
            box-shadow: 0 10px 32px -16px rgba(26,23,38,0.14);
        }

        .source-view {
            font-family: 'SF Mono', Menlo, monospace; font-size: 12px;
            background: #FFFFFF;
            border: 1px solid #E9E5EE;
            border-radius: 16px;
            padding: 22px;
            color: #4A4658;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 70vh;
            overflow: auto;
            line-height: 1.55;
        }

        .meta-panel {
            margin-top: 20px;
            padding: 18px 22px; border-radius: 14px;
            background: linear-gradient(135deg, rgba(var(--glow-purple), 0.06) 0%, rgba(var(--glow-purple), 0.015) 100%);
            border: 1px solid rgba(var(--glow-purple), 0.18);
            font-size: 13px; line-height: 1.65; color: #ffffff;
        }
        .meta-panel h4 { font-size: 10.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #6d28d9; margin-bottom: 12px; }
        .meta-panel dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 16px; }
        .meta-panel dt { color: #1A1726; font-weight: 500; }
        .meta-panel a { color: #6d28d9; border-bottom: 1px dotted rgba(var(--glow-purple), 0.32); }

        /* Mobile responsive — the desktop layout pins the sidebar and main
           panels to viewport height and makes each independently scrollable.
           On iPhone that meant the sidebar consumed an entire viewport and
           the main detail was hidden below another full scrollable region —
           "crammed" was the right word. On mobile, let both flow naturally
           in the document so a single page scroll moves through the sidebar
           list and then through the detail view. Also tighten padding,
           collapse the meta-panel grid to one column, and downsize the
           preview iframe so it's not a 600px-tall wall on a 660px screen. */
        @media (max-width: 720px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar, .main {
                max-height: none;
                overflow-y: visible;
            }
            .sidebar {
                padding: 22px clamp(14px, 4vw, 18px);
                border-right: none;
                border-bottom: 1px solid #E9E5EE;
            }
            .main {
                padding: 22px clamp(14px, 4vw, 18px) 40px;
            }
            .detail-header { gap: 14px; }
            .detail-title { font-size: 22px; }
            .detail-summary { font-size: 14px; }
            .detail-actions { width: 100%; }
            .detail-actions .btn { flex: 1 1 calc(50% - 4px); }
            .preview-frame {
                min-height: 0;
                height: 60vh;
            }
            .meta-panel {
                padding: 16px;
            }
            .meta-panel dl {
                grid-template-columns: 1fr;
                gap: 4px 0;
            }
            .meta-panel dt {
                margin-top: 10px;
                font-size: 10.5px;
                font-weight: 700;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #1A1726;
            }
            .meta-panel dd { margin-bottom: 2px; }
            .kind-tabs { margin-bottom: 14px; }
            .kind-tab { padding: 9px 10px; font-size: 12px; }
            .post-item-title { font-size: 13.5px; }
            .post-item-summary { font-size: 11.5px; }
        }
        @media (max-width: 420px) {
            .detail-actions .btn { flex: 1 1 100%; }
        }

        .toast {
            position: fixed; bottom: 24px; right: 24px; z-index: 1000;
            padding: 14px 22px; border-radius: 12px;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(18px);
            border: 1px solid #E9E5EE;
            color: var(--white); font-size: 13.5px; font-weight: 500;
            box-shadow: 0 18px 40px -12px rgba(26,23,38,0.14);
            opacity: 0; transform: translateY(16px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { border-color: rgba(var(--status-published), 0.40); }
        .toast.error { border-color: rgba(var(--status-rejected), 0.40); }

        .loader { text-align: center; padding: 60px; color: #4A4658; }
        .loader-spinner { width: 28px; height: 28px; border: 2px solid rgba(var(--glow-purple), 0.18); border-top-color: #6d28d9; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    
        /* Fixed finalized hero line-art backdrop (static — does NOT play) so the
           glass dashboard components frost against real texture, uniform with the
           rest of the site. Move the opaque page base to html so the z-index:-1
           art shows; body keeps only its translucent glow on top. Added 2026-06-29. */
        html { background:
            radial-gradient(110vmax 80vmax at 82% -10%, rgba(139, 92, 246, 0.09), transparent 62%),
            radial-gradient(90vmax 70vmax at 4% 112%, rgba(109, 40, 217, 0.07), transparent 58%),
            linear-gradient(178deg, #FDFCFB 0%, #FBFAF8 55%, #F6F3EF 100%);
            /* 2026-07-28 — explicit plum canvas. The old var-fallback chain
               bottomed out at legacy #FBFAF8 black on pages whose tokens
               didn't resolve, leaving flat near-black canvases (user-caught
               on /curriculum/; survey found 16 such pages). */ }
        body { background-color: transparent !important; }
    
/* ===== 2026-08-08 accessibility pass (measured, not assumed) =====
   Audit found: contrast failures concentrated on translucent "light" panels,
   nav/footer links 15-20px tall, carousel pips 7x7px, and a skip link that
   itself failed contrast. WCAG 2.5.8 wants a 24x24 minimum target; 2.4.7
   wants a visible focus indicator; 1.4.3 wants 4.5:1 on body text. */
nav a, .site-nav a, .main-nav a, footer a, .foot a, .footer-content a,
.nav-back, .nav-brand, .brand, .crumb a {
    min-height: 24px;
    display: inline-flex;
    align-items: center;
}
/* Pips keep their small dot but get a real 24px hit area via padding. */
.mz-grid-pip, .carousel-pip, [class*="-pip"] {
    min-width: 24px;
    min-height: 24px;
    padding: 8px;
    background-clip: content-box;
    box-sizing: border-box;
}
.mobile-toggle, .nav-toggle, [class*="menu-toggle"] {
    min-width: 44px;
    min-height: 44px;
}
/* Focus must be visible on every interactive element, on any background. */
a:focus-visible, button:focus-visible, [role="button"]:focus-visible,
summary:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid #6d28d9;
    outline-offset: 2px;
    border-radius: 6px;
}
/* The skip link was white on light purple (2.96:1). Dark plum ground = 13:1. */
.skip-link {
    background: #2e1065 !important;
    color: #ffffff !important;
    border: 1px solid #6d28d9;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>
<body>
<!-- 2026-08-12 — page background art REMOVED from the admin backend at the
     owner's instruction ("remove the image background requirment - the
     missing image blue box is behind every page"). It rendered as a broken
     image on every admin page: /admin/* sends
     Cross-Origin-Embedder-Policy: require-corp, and the art was loaded from
     the APEX (https://mountzara.com/media/...) while the site is browsed on
     www — a cross-origin subresource that ships no
     Cross-Origin-Resource-Policy header, so COEP blocks it and the browser
     paints the placeholder box. Do not reintroduce a cross-origin image
     under /admin/. -->
    <script src="/admin/_nav.js"></script>
    <nav class="nav">
        <div class="nav-left">
            <a href="/" class="nav-brand">
                <img src="/assets/images/mount-zara-monogram.png" alt="Mount Zara">
                MOUNT ZARA
            </a>
            <span class="nav-admin-badge">Admin</span>
        </div>
        <div class="nav-user">
            Signed in as <span class="nav-user-email" id="userEmail">…</span>
        </div>
    </nav>

    <div class="layout">
        <aside class="sidebar">
            <div class="kind-tabs">
                <!-- Tab labels reflect audience semantics:
                     kind="evidence" = Physician Blog (deep journal-club / MIGS Monday Morning)
                     kind="blog"     = Influencer Page (trend rebuttals for patient + public)
                     The internal kind slug is preserved for stable URLs; only display label changes. -->
                <button class="kind-tab active" data-kind="evidence">Physician Blog</button>
                <button class="kind-tab" data-kind="blog">Influencer Page</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-header">
                    <span class="sidebar-title">Pending review</span>
                    <span class="sidebar-count" id="draftCount">0</span>
                </div>
                <div id="draftList" class="post-list"></div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-header">
                    <span class="sidebar-title">Published</span>
                    <span class="sidebar-count" id="publishedCount">0</span>
                </div>
                <div id="publishedList" class="post-list"></div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-header">
                    <span class="sidebar-title">Rejected</span>
                    <span class="sidebar-count" id="rejectedCount">0</span>
                </div>
                <div id="rejectedList" class="post-list"></div>
            </div>
        </aside>

        <main class="main" id="main">
            <div class="empty-main">
                <h2>Select a post from the sidebar</h2>
                <p>Drafts pending your review show up at the top. Click any item to preview, edit, approve, or reject.</p>
            </div>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api/posts';
        const state = {
            // Default to evidence/physician-blog since the Monday Morning digest
            // (the primary recurring publication) lives in that tab now.
            kind: 'evidence',
            posts: [],
            selectedId: null,
            view: 'preview',  // preview | source
        };

        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); } catch { return ''; } };
        const fmtDateTime = (iso) => { try { return new Date(iso).toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return ''; } };

        function showToast(msg, kind = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${kind} show`;
            setTimeout(() => t.classList.remove('show'), 2800);
        }

        // Why the explicit Authorization header even though we're already
        // signed in at /admin/ via Basic Auth:
        // ----------------------------------------------------------------
        // The browser caches Basic Auth credentials per RFC 7617 §2.2 by
        // protection space (origin + realm + URL-prefix tree). The realm
        // we authenticated at is "Mount Zara Admin" rooted at /admin/.
        // When this SPA does fetch('/api/posts/_admin?kind=blog') the URL
        // is OUTSIDE the /admin/ prefix, so Chrome/Safari do NOT auto-send
        // the cached Authorization header — and the API returns 401, which
        // the dashboard would silently render as "0 drafts" (the bug the
        // user just hit). We can't read the browser's cached credentials
        // from JS, so we prompt the user ONCE, store base64(user:pass) in
        // sessionStorage (cleared on tab close), and attach Authorization
        // on every API fetch explicitly. No persistent storage — sessionStorage
        // dies with the tab, so a password manager paste each session is still
        // the workflow. If the credentials are bad we 401 and re-prompt once.
        // Removed: ensureAdminCreds() and its two prompt() dialogs. The
        // browser's Basic-Auth session that admitted the user to
        // /admin/content/ answers the API's 401 challenge automatically —
        // the same pattern every other admin page uses. One legacy cleanup:
        sessionStorage.removeItem('mz_admin_basic');

        // `noPrompt` (used by the silent 30s auto-refresh) means: never pop a
        // credential prompt. Without it, a user who hit Cancel on the login
        // prompt got re-prompted every 30 seconds forever (the auto-refresh
        // 401'd → reprompted on a loop). Now the background refresh fails quietly
        // and only a user-initiated action re-prompts.
        async function api(method, path, body, { noPrompt = false } = {}) {
            const opts = { method, headers: {}, credentials: 'include' };
            if (body !== undefined) {
                opts.headers['content-type'] = 'application/json';
                opts.body = JSON.stringify(body);
            }
            const res = await fetch(`${API}${path}`, opts);
            if (res.status === 401 && !noPrompt) {
                // The browser's Basic-Auth session lapsed. A reload
                // re-triggers the native dialog on the page itself, which is
                // the one place credentials should ever be typed.
                location.reload();
                return new Promise(() => {});   // reload takes it from here
            }
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            return data;
        }

        // loadPosts has two callers:
        //   - user-initiated (sidebar click, tab switch, approve/reject): we
        //     fully re-render main with a loader → fetched post.
        //   - auto-refresh setInterval every 30s: we MUST NOT clobber main
        //     because the user is mid-read and clobbering main resets their
        //     scroll position to the top of the page. Refresh sidebar counts
        //     silently, and only touch main if the *currently selected* post
        //     changed status under us (e.g. another tab approved it).
        async function loadPosts(opts) {
            const silent = opts && opts.silent === true;
            const savedScrollY = silent ? window.scrollY : null;
            try {
                const data = await api('GET', `/_admin?kind=${encodeURIComponent(state.kind)}`, undefined, { noPrompt: silent });
                const prevStatus = state.selectedId
                    ? (state.posts.find(p => p.id === state.selectedId) || {}).status
                    : null;
                state.posts = data.posts || [];
                renderSidebar();
                if (!state.selectedId) renderMain();
                const stillExists = state.selectedId && state.posts.find(p => p.id === state.selectedId);
                if (state.selectedId && !stillExists) {
                    state.selectedId = null;
                    renderMain();
                } else if (state.selectedId && !silent) {
                    loadDetail(state.selectedId);
                } else if (state.selectedId && silent && stillExists && stillExists.status !== prevStatus) {
                    // status changed externally — refresh the detail so the
                    // action buttons (Approve/Reject vs View live) update.
                    loadDetail(state.selectedId);
                }
                // silent + no change: leave main untouched, preserve scroll.
            } catch (e) {
                showToast(`Failed to load: ${e.message}`, 'error');
            } finally {
                if (savedScrollY !== null) {
                    // jump (not smooth) so the user never sees motion.
                    window.scrollTo({ top: savedScrollY, left: 0, behavior: 'instant' });
                }
            }
        }

        function renderSidebar() {
            const drafts = state.posts.filter(p => p.status === 'draft');
            const published = state.posts.filter(p => p.status === 'published');
            const rejected = state.posts.filter(p => p.status === 'rejected');
            document.getElementById('draftCount').textContent = drafts.length;
            document.getElementById('publishedCount').textContent = published.length;
            document.getElementById('rejectedCount').textContent = rejected.length;

            function renderList(arr, container, emptyMsg) {
                if (!arr.length) {
                    container.innerHTML = `<div class="empty-list">${esc(emptyMsg)}</div>`;
                    return;
                }
                container.innerHTML = arr.map(p => `
                    <div class="post-item ${state.selectedId === p.id ? 'active' : ''}" data-id="${esc(p.id)}">
                        <div class="post-item-row">
                            <span class="status-pill status-${esc(p.status)}">${esc(p.status)}</span>
                            <span class="post-item-date">${esc(fmtDate(p.published_at || p.created_at))}</span>
                        </div>
                        <div class="post-item-title">${esc(p.title || '(Untitled)')}</div>
                        <div class="post-item-summary">${esc(p.summary || '')}</div>
                    </div>
                `).join('');
                container.querySelectorAll('.post-item').forEach(el => {
                    el.addEventListener('click', () => {
                        state.selectedId = el.dataset.id;
                        renderSidebar();
                        loadDetail(state.selectedId);
                    });
                });
            }
            renderList(drafts, document.getElementById('draftList'), 'Nothing pending.');
            renderList(published, document.getElementById('publishedList'), 'Nothing published.');
            renderList(rejected, document.getElementById('rejectedList'), 'Nothing rejected.');
        }

        async function loadDetail(id) {
            const main = document.getElementById('main');
            main.innerHTML = '<div class="loader"><div class="loader-spinner"></div>Loading…</div>';
            try {
                const post = await api('GET', `/_admin/${encodeURIComponent(id)}`);
                renderMain(post);
            } catch (e) {
                main.innerHTML = `<div class="empty-main"><h2>Failed to load post</h2><p>${esc(e.message)}</p></div>`;
            }
        }

        function renderMain(post) {
            const main = document.getElementById('main');
            if (!post) {
                // Zero posts anywhere is a different state from "nothing
                // selected yet" — the second sentence would be a lie in the
                // first case, so they get different copy.
                main.innerHTML = state.posts.length === 0
                    ? `<div class="empty-main"><p style="max-width: 54ch; line-height: 1.6;">Drafts from the writing pipeline land here to approve, edit or reject before they go public. Nothing is waiting — the pipeline posts new drafts on its Monday and Tuesday runs.</p></div>`
                    : `<div class="empty-main"><h2>Select a post from the sidebar</h2><p>Drafts pending your review show up at the top. Click any item to preview, edit, approve, or reject.</p></div>`;
                return;
            }
            const publicPath = post.kind === 'blog' ? `/trending/?id=${encodeURIComponent(post.id)}` : `/evidence/?id=${encodeURIComponent(post.id)}`;
            const isDraft = post.status === 'draft';
            const isRejected = post.status === 'rejected';
            main.innerHTML = `
                <div class="detail-header">
                    <div class="detail-title-row">
                        <div class="detail-meta-row">
                            <span class="status-pill status-${esc(post.status)}">${esc(post.status)}</span>
                            <span class="post-item-date">${esc(fmtDateTime(post.published_at || post.created_at))}</span>
                            ${post.week_label ? `<span class="status-pill" style="color: #6d28d9;background:rgba(var(--glow-purple),0.10);border:1px solid rgba(var(--glow-purple),0.24);">${esc(post.week_label)}</span>` : ''}
                            ${post.verdict ? `<span class="status-pill" style="color: #6d28d9;background:rgba(var(--glow-purple),0.10);border:1px solid rgba(var(--glow-purple),0.24);">${esc(post.verdict)}</span>` : ''}
                        </div>
                        <h1 class="detail-title">${esc(post.title || '(Untitled)')}</h1>
                        <p class="detail-summary">${esc(post.summary || '')}</p>
                    </div>
                    <div class="detail-actions">
                        ${isDraft ? `<button class="btn btn-approve" id="btnApprove">✓ Approve & publish</button>` : ''}
                        ${isDraft ? `<button class="btn btn-reject" id="btnReject">✕ Reject</button>` : ''}
                        ${isRejected ? `<button class="btn btn-approve" id="btnApprove">↺ Publish anyway</button>` : ''}
                        ${post.status === 'published' ? `<a class="btn btn-secondary" href="${esc(publicPath)}" target="_blank">View live ↗</a>` : ''}
                    </div>
                </div>

                <div class="preview-toggle">
                    <button class="${state.view === 'preview' ? 'active' : ''}" data-view="preview">Preview (rendered)</button>
                    <button class="${state.view === 'source' ? 'active' : ''}" data-view="source">Source HTML</button>
                </div>

                <div id="previewContainer"></div>

                <div class="meta-panel">
                    <h4>Pipeline manifest</h4>
                    <dl>
                        <dt>Post ID</dt><dd><code>${esc(post.id)}</code></dd>
                        <dt>Kind</dt><dd>${esc(post.kind)}</dd>
                        ${post.week_label ? `<dt>Week</dt><dd>${esc(post.week_label)}</dd>` : ''}
                        <dt>Topics</dt><dd>${(post.topics_covered || []).length ? (post.topics_covered).map(esc).join(' · ') : '—'}</dd>
                        <dt>PMIDs cited</dt><dd>${(() => {
                            const pmids = post.pmids_cited || [];
                            if (!pmids.length) return '—';
                            if (pmids.length <= 12) {
                                return pmids.map(p => `<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(p)}/" target="_blank" rel="noopener" style="color: #6d28d9;">${esc(p)}</a>`).join(' · ');
                            }
                            return `<details><summary style="cursor:pointer;color: #6d28d9;">${pmids.length} cited — show list</summary><div style="margin-top:8px;line-height:1.9;">${pmids.map(p => `<a href="https://pubmed.ncbi.nlm.nih.gov/${esc(p)}/" target="_blank" rel="noopener" style="color: #6d28d9;">${esc(p)}</a>`).join(' · ')}</div></details>`;
                        })()}</dd>
                        <dt>KB entries</dt><dd>${(() => {
                            const kb = post.kb_entries_retrieved || [];
                            if (!kb.length) {
                                // Honest GAP badge — §0.8 requires retrieval; zero retrieved is not compliance.
                                return `<span style="color:#92400E;background:rgba(245,158,11,0.10);border:1px solid rgba(245,158,11,0.35);padding:2px 10px;border-radius:999px;font-weight:600;font-size:12px;letter-spacing:0.02em;">0 retrieved · § 0.8 GAP</span>`;
                            }
                            const ok = `<span style="color:rgba(74,222,128,0.95);background:rgba(34,197,94,0.10);border:1px solid rgba(34,197,94,0.35);padding:2px 10px;border-radius:999px;font-weight:600;font-size:12px;letter-spacing:0.02em;">${kb.length} retrieved · § 0.8 compliant</span>`;
                            const list = `<details><summary style="cursor:pointer;margin-top:8px;color: #6d28d9;">Show topic syntheses</summary><ul style="margin:8px 0 0 18px;padding:0;line-height:1.8;">${kb.map(e => {
                                if (typeof e === 'string') return `<li>${esc(e)}</li>`;
                                const name = esc(e.topic_name || e.topicName || e.id || '?');
                                const sub = esc(e.subspecialty || '');
                                const dc = e.document_count != null ? `, ${esc(e.document_count)} docs` : '';
                                return `<li><strong>${name}</strong> <span style="opacity:.7;">(${sub}${dc})</span></li>`;
                            }).join('')}</ul></details>`;
                            return ok + list;
                        })()}</dd>
                        ${(post.gaps_surfaced || []).length ? `<dt>Gaps</dt><dd>${(() => {
                            const gaps = post.gaps_surfaced || [];
                            return `<details><summary style="cursor:pointer;color:#92400E;">${gaps.length} cited paper${gaps.length===1?'':'s'} not in KB landmark/recent index</summary><ul style="margin:8px 0 0 18px;padding:0;line-height:1.8;">${gaps.map(g => {
                                if (typeof g === 'string') return `<li>${esc(g)}</li>`;
                                const pmid = esc(g.pmid || '?');
                                const reason = esc(g.reason || '');
                                return `<li><a href="https://pubmed.ncbi.nlm.nih.gov/${pmid}/" target="_blank" rel="noopener" style="color: #6d28d9;">PMID ${pmid}</a><span style="opacity:.7;"> — ${reason}</span></li>`;
                            }).join('')}</ul></details>`;
                        })()}</dd>` : ''}
                        ${post.linkedin_draft ? `<dt>LinkedIn</dt><dd><details><summary style="cursor:pointer;color: #6d28d9;">Show draft</summary><pre style="white-space:pre-wrap;margin-top:8px;color:#ffffff;font-family:inherit;font-size:13px;line-height:1.6;">${esc(post.linkedin_draft)}</pre></details></dd>` : ''}
                        ${post.instagram_draft ? `<dt>Instagram</dt><dd><details><summary style="cursor:pointer;color: #6d28d9;">Show draft</summary><pre style="white-space:pre-wrap;margin-top:8px;color:#ffffff;font-family:inherit;font-size:13px;line-height:1.6;">${esc(post.instagram_draft)}</pre></details></dd>` : ''}
                        <dt>Created</dt><dd>${esc(fmtDateTime(post.created_at))}</dd>
                        ${post.published_at ? `<dt>Published</dt><dd>${esc(fmtDateTime(post.published_at))}</dd>` : ''}
                    </dl>
                </div>
            `;

            renderPreview(post);

            document.querySelectorAll('.preview-toggle button').forEach(b => {
                b.addEventListener('click', () => {
                    state.view = b.dataset.view;
                    document.querySelectorAll('.preview-toggle button').forEach(x => x.classList.toggle('active', x === b));
                    renderPreview(post);
                });
            });

            const approveBtn = document.getElementById('btnApprove');
            const rejectBtn = document.getElementById('btnReject');
            if (approveBtn) approveBtn.addEventListener('click', () => approve(post.id));
            if (rejectBtn) rejectBtn.addEventListener('click', () => reject(post.id));
        }

        function renderPreview(post) {
            const c = document.getElementById('previewContainer');
            if (state.view === 'source') {
                c.innerHTML = `<pre class="source-view">${esc(post.body_html || '(empty body)')}</pre>`;
            } else {
                // Live preview by injecting the post body inside a sandboxed iframe
                // that mirrors the public page's typography. Using srcdoc so no
                // network round-trip is needed.
                const previewDoc = `
                    <!DOCTYPE html>
                    <html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
                    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
                    <style>
                        body { margin: 0; padding: 40px clamp(20px, 5vw, 60px); font-family: 'Avenir Next', 'Avenir', 'Nunito Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif; background: #FBFAF8; color: #1A1726; line-height: 1.65; font-size: 16px; }
                        .wrap { max-width: 760px; margin: 0 auto; }
                        h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin: 0 0 18px; color: #1A1726; }
                        h2 { font-size: clamp(20px, 2.2vw, 28px); margin: 36px 0 12px; color: #1A1726; font-weight: 600; }
                        h3 { font-size: clamp(17px, 1.8vw, 21px); margin: 28px 0 10px; color: #1A1726; font-weight: 600; }
                        p { margin: 14px 0; color: #4A4658; }
                        ul, ol { margin: 14px 0; padding-left: 22px; }
                        li { margin: 8px 0; }
                        a { color: #6d28d9; border-bottom: 1px solid rgba(139,92,246,0.32); text-decoration: none; }
                        code { background: rgba(255,255,255,0.72); padding: 2px 7px; border-radius: 5px; font-family: 'SF Mono', Menlo, monospace; font-size: 0.92em; }
                        blockquote { border-left: 3px solid rgba(139,92,246,0.55); margin: 20px 0; padding: 12px 0 12px 20px; color: #4A4658; font-style: italic; }
                        .summary { font-size: 17px; line-height: 1.55; color: #4A4658; margin-bottom: 30px; padding-bottom: 24px; border-bottom: 1px solid #E9E5EE; }
                        .eyebrow { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #6d28d9; margin-bottom: 14px; padding: 4px 10px; background: rgba(139,92,246,0.10); border: 1px solid rgba(139,92,246,0.28); border-radius: 999px; }
                    </style>
                    </head><body><div class="wrap">
                        ${post.week_label ? `<span class="eyebrow">${esc(post.week_label)}</span>` : (post.verdict ? `<span class="eyebrow">${esc(post.verdict)}</span>` : '')}
                        <h1>${esc(post.title || '')}</h1>
                        <p class="summary">${esc(post.summary || '')}</p>
                        ${post.body_html || ''}
                    </div><style id="mz-canvas-guard">html{background-color:#FBFAF8}</style>
</body></html>
                `;
                // SECURITY (2026-06-12): allow-scripts WITHOUT allow-same-origin.
                // This preview renders not-yet-approved draft body_html, so it must
                // NOT run in the admin's origin — with both flags, a script in an
                // unreviewed draft could read the admin session/DOM (stored-XSS /
                // privilege escalation in the exact tool meant to vet that content).
                // Dropping allow-same-origin runs the srcdoc as an opaque origin:
                // self-contained post scripts (SVG charts, CSS/RAF animations,
                // IntersectionObserver scroll-reveal) still execute and preview
                // faithfully, but they can no longer touch the admin session.
                c.innerHTML = `<iframe class="preview-frame" srcdoc="${esc(previewDoc)}" sandbox="allow-scripts"></iframe>`;
            }
        }

        async function approve(id) {
            if (!confirm('Approve & publish this post? It will become live on mountzara.com immediately.')) return;
            try {
                await api('POST', `/${encodeURIComponent(id)}/approve`);
                showToast('Published');
                await loadPosts();
            } catch (e) { showToast(`Approve failed: ${e.message}`, 'error'); }
        }
        async function reject(id) {
            if (!confirm('Reject this post? You can still publish later from the rejected list.')) return;
            try {
                await api('POST', `/${encodeURIComponent(id)}/reject`);
                showToast('Rejected');
                await loadPosts();
            } catch (e) { showToast(`Reject failed: ${e.message}`, 'error'); }
        }

        // Pull user email from Cloudflare Access header (if exposed via meta tag) or fall back
        async function loadUser() {
            // CF Access sets Cf-Access-Authenticated-User-Email header server-side.
            // The browser can fetch /cdn-cgi/access/get-identity to retrieve it.
            try {
                const r = await fetch('/cdn-cgi/access/get-identity');
                if (r.ok) {
                    const data = await r.json();
                    if (data && data.email) {
                        document.getElementById('userEmail').textContent = data.email;
                        return;
                    }
                }
            } catch {}
            document.getElementById('userEmail').textContent = 'authenticated';
        }

        document.querySelectorAll('.kind-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                state.kind = tab.dataset.kind;
                state.selectedId = null;
                document.querySelectorAll('.kind-tab').forEach(t => t.classList.toggle('active', t === tab));
                renderMain();
                loadPosts();
            });
        });

        loadUser();
        loadPosts();
        // gentle auto-refresh every 30s — silent so it doesn't reset
        // the user's scroll position while they're reading a draft.
        // Only auto-refresh while signed in — a signed-out/cancelled state must
        // not trigger background calls (which previously re-prompted on a loop).
        setInterval(() => {
            loadPosts({ silent: true });   // session cookie authenticates; no stored creds to check
        }, 30000);
    </script>
</body>
</html>
