<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Education · Member Portal · Mount Zara</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #120f1b;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.10);
            --fg-strong: #ffffff;
            --fg-mid: #ffffff;
            --fg-soft: #ffffff;
            --fg-dim: #ffffff;
            --accent: #6d28d9;
            --accent-soft: #a78bfa;
            --glow-purple: 167, 139, 250;
            --green: #10b981;
            --amber: #f59e0b;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(var(--glow-purple), 0.12), transparent 60%),
                var(--bg-base);
            color: var(--fg-mid);
            font-family: 'Avenir Next', 'Avenir', 'Nunito Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            font-feature-settings: "ss01", "cv11";
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--accent-soft); text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--fg-strong); }
        .wrap { max-width: 920px; margin: 0 auto; padding: clamp(28px, 5vw, 48px) clamp(20px, 5vw, 36px) 64px; }
        .top-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 22px; font-size: 13px; color: var(--fg-soft);
        }
        .eyebrow {
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.22em; text-transform: uppercase;
            color: rgba(var(--glow-purple), 0.95);
            margin-bottom: 12px;
        }
        h1 {
            font-weight: 200; font-size: clamp(28px, 4vw, 38px);
            letter-spacing: -0.022em; line-height: 1.1;
            color: var(--fg-strong); margin: 0 0 8px 0;
        }
        .lede {
            font-size: 15px; line-height: 1.6;
            color: var(--fg-soft); margin: 0 0 24px 0; max-width: 64ch;
        }

        .filter-bar { display: flex; gap: 6px; margin: 14px 0 18px 0; flex-wrap: wrap; }
        .filter-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 14px;
            color: var(--fg-soft);
            font-size: 12px;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.18s;
        }
        .filter-chip:hover { color: var(--fg-strong); border-color: rgba(var(--glow-purple), 0.45); }
        .filter-chip.active {
            background: rgba(var(--glow-purple), 0.16);
            border-color: rgba(var(--glow-purple), 0.55);
            color: var(--accent-soft);
        }

        .grid {
            display: grid; gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }
        .ed-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 20px;
            backdrop-filter: blur(28px) saturate(165%);
            -webkit-backdrop-filter: blur(28px) saturate(165%);
            cursor: pointer;
            display: flex; flex-direction: column;
            text-decoration: none; color: inherit;
            transition: all 0.22s;
            animation: mzRise 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
            position: relative;
        }
        @keyframes mzRise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .ed-card:hover {
            transform: translateY(-2px);
            border-color: rgba(var(--glow-purple), 0.45);
            background: rgba(var(--glow-purple), 0.04);
        }
        .ed-card h3 {
            margin: 0 0 6px 0; font-size: 16px; font-weight: 500;
            color: var(--fg-strong); letter-spacing: -0.005em;
        }
        .ed-card .ed-summary {
            font-size: 13px; line-height: 1.5; color: var(--fg-soft);
            flex: 1; margin: 0 0 12px 0;
        }
        .ed-card .ed-meta {
            font-size: 11px; color: var(--fg-dim);
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
        }
        .ed-tag {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 10.5px;
            letter-spacing: 0.02em;
            color: var(--fg-soft);
        }
        .ed-badge-row { position: absolute; top: 14px; right: 16px; display: flex; gap: 6px; }
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.14em; text-transform: uppercase;
            padding: 3px 8px; border-radius: 999px;
            white-space: nowrap;
        }
        .badge-assigned {
            background: rgba(245, 158, 11, 0.12);
            color: rgba(252, 211, 77, 0.95);
            border: 1px solid rgba(245, 158, 11, 0.45);
        }
        .badge-completed {
            background: rgba(16, 185, 129, 0.12);
            color: rgba(110, 231, 183, 0.95);
            border: 1px solid rgba(16, 185, 129, 0.45);
        }
        .badge-new {
            background: rgba(var(--glow-purple), 0.18);
            color: var(--accent-soft);
            border: 1px solid rgba(var(--glow-purple), 0.45);
        }

        .empty-state {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 36px 20px;
            text-align: center; color: var(--fg-soft); font-size: 14px;
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
        }

        /* reader pane */
        .reader { display: none; }
        .reader.open { display: block; }
        .reader-back {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 13px; color: var(--fg-soft);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 8px 12px;
            cursor: pointer;
            margin-bottom: 16px;
            transition: all 0.18s;
        }
        .reader-back:hover { color: var(--fg-strong); border-color: rgba(var(--glow-purple), 0.45); }
        .reader-header {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px 22px;
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            margin-bottom: 14px;
        }
        .reader-header h2 { margin: 0 0 6px 0; font-weight: 300; font-size: clamp(22px, 3vw, 28px); color: var(--fg-strong); letter-spacing: -0.015em; }
        .reader-header .summary { font-size: 14.5px; color: var(--fg-soft); margin: 0 0 12px 0; line-height: 1.55; }
        .reader-header .meta { font-size: 11.5px; color: var(--fg-dim); display: flex; flex-wrap: wrap; gap: 12px; }

        .prose {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px 28px;
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            font-size: 15px; line-height: 1.65;
            color: var(--fg-mid);
        }
        .prose h1 { font-size: 26px; font-weight: 300; color: var(--fg-strong); letter-spacing: -0.012em; margin: 0 0 14px 0; }
        .prose h2 { font-size: 19px; font-weight: 500; color: var(--fg-strong); margin: 28px 0 10px 0; }
        .prose h3 { font-size: 16px; font-weight: 500; color: var(--fg-strong); margin: 24px 0 8px 0; }
        .prose p { margin: 0 0 12px 0; }
        .prose ul, .prose ol { margin: 0 0 14px 0; padding-left: 22px; }
        .prose li { margin: 4px 0; }
        .prose code {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1px 6px;
            font-size: 0.92em;
        }
        .prose strong { color: var(--fg-strong); }
        .prose a { color: var(--accent-soft); text-decoration: underline; text-decoration-color: rgba(var(--glow-purple), 0.40); text-underline-offset: 3px; }
        .prose blockquote {
            border-left: 2px solid rgba(var(--glow-purple), 0.55);
            margin: 14px 0;
            padding: 6px 14px;
            color: var(--fg-soft);
            background: rgba(var(--glow-purple), 0.04);
            border-radius: 0 8px 8px 0;
        }
        .complete-row {
            display: flex; justify-content: space-between; align-items: center;
            gap: 14px; margin-top: 14px; flex-wrap: wrap;
        }
        button {
            font: inherit; cursor: pointer;
            background: rgba(var(--glow-purple), 0.18);
            border: 1px solid rgba(var(--glow-purple), 0.55);
            border-radius: 9px;
            padding: 10px 16px;
            color: var(--fg-strong);
            font-size: 13px; font-weight: 500;
            transition: transform 0.18s, background 0.18s, border-color 0.18s;
        }
        button:hover { transform: translateY(-1px); background: rgba(var(--glow-purple), 0.26); }
        button.ghost {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--border); color: var(--fg-soft);
        }
        button.ghost:hover { color: var(--fg-strong); border-color: rgba(var(--glow-purple), 0.45); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    
/* ===== 2026-08-08 accessibility pass (measured, not assumed) =====
   Audit found: contrast failures concentrated on translucent "light" panels,
   nav/footer links 15-20px tall, carousel pips 7x7px, and a skip link that
   itself failed contrast. WCAG 2.5.8 wants a 24x24 minimum target; 2.4.7
   wants a visible focus indicator; 1.4.3 wants 4.5:1 on body text. */
nav a, .site-nav a, .main-nav a, footer a, .foot a, .footer-content a,
.nav-back, .nav-brand, .brand, .crumb a {
    min-height: 24px;
    display: inline-flex;
    align-items: center;
}
/* Pips keep their small dot but get a real 24px hit area via padding. */
.mz-grid-pip, .carousel-pip, [class*="-pip"] {
    min-width: 24px;
    min-height: 24px;
    padding: 8px;
    background-clip: content-box;
    box-sizing: border-box;
}
.mobile-toggle, .nav-toggle, [class*="menu-toggle"] {
    min-width: 44px;
    min-height: 44px;
}
/* Focus must be visible on every interactive element, on any background. */
a:focus-visible, button:focus-visible, [role="button"]:focus-visible,
summary:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid #c4b5fd;
    outline-offset: 2px;
    border-radius: 6px;
}
/* The skip link was white on light purple (2.96:1). Dark plum ground = 13:1. */
.skip-link {
    background: #2e1065 !important;
    color: #ffffff !important;
    border: 1px solid #c4b5fd;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>
<body>
    <div class="wrap">
        <div class="top-row">
            <a href="/portal/">&larr; Member portal</a>
            <span style="color: var(--fg-dim);">/portal/education</span>
        </div>

        <div id="list-view">
            <p class="eyebrow">Member portal · Learn</p>
            <h1>Patient primers</h1>
            <p class="lede">Plain-language explainers on the conditions, procedures, and recovery topics that come up most often in CBG/MIGS care. Anything assigned to you sits at the top.</p>

            <div class="filter-bar" id="tag-filter">
                <button class="filter-chip active" data-tag="">All</button>
            </div>

            <div id="grid" class="grid">
                <div class="empty-state">Loading materials…</div>
            </div>
        </div>

        <div id="reader-view" class="reader">
            <button class="reader-back" id="btn-back">&larr; Back to library</button>
            <div class="reader-header">
                <h2 id="r-title">—</h2>
                <p class="summary" id="r-summary">—</p>
                <div class="meta" id="r-meta"></div>
            </div>
            <div class="prose" id="r-prose"></div>
            <div class="complete-row">
                <div id="complete-status" style="font-size:13px; color:var(--fg-soft);">—</div>
                <div style="display:flex; gap:8px;">
                    <button class="ghost" id="btn-incomplete" style="display:none;">Mark not done</button>
                    <button id="btn-complete">Mark complete</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const state = {
            materials: [],
            allTags: new Set(),
            currentSlug: null,
            currentMaterial: null,
            filterTag: '',
        };

        async function fetchJson(url, opts) {
            const res = await fetch(url, {
                credentials: 'include', cache: 'no-store',
                headers: { 'content-type': 'application/json' },
                ...(opts || {}),
            });
            const ct = res.headers.get('content-type') || '';
            const body = ct.includes('json') ? await res.json() : await res.text();
            if (!res.ok) {
                const e = new Error((body && body.message) || (body && body.error) || res.statusText);
                e.code = body && body.error;
                e.status = res.status;
                throw e;
            }
            return body;
        }
        function escapeHtml(s) {
            if (s == null) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        // ---- minimal markdown renderer (safe-by-default) ----
        // Renders headings (#, ##, ###), paragraphs, **bold**, *italic*,
        // `code`, [text](url), > blockquotes, - / * / 1. lists.
        // No raw HTML pass-through; everything is escaped first.
        function renderMarkdown(src) {
            if (typeof src !== 'string') return '';
            // Normalize line endings + escape HTML first.
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;
            while (i < lines.length) {
                const line = lines[i];
                // Heading
                let m;
                if ((m = /^(#{1,3})\s+(.+)$/.exec(line))) {
                    const level = m[1].length;
                    out.push(`<h${level}>${inlineMd(m[2])}</h${level}>`);
                    i++; continue;
                }
                // Blockquote (single-line)
                if (/^>\s+/.test(line)) {
                    const block = [];
                    while (i < lines.length && /^>\s+/.test(lines[i])) {
                        block.push(lines[i].replace(/^>\s+/, ''));
                        i++;
                    }
                    out.push(`<blockquote>${inlineMd(block.join(' '))}</blockquote>`);
                    continue;
                }
                // Unordered list
                if (/^[-*]\s+/.test(line)) {
                    const items = [];
                    while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
                        items.push(lines[i].replace(/^[-*]\s+/, ''));
                        i++;
                    }
                    out.push(`<ul>${items.map(it => `<li>${inlineMd(it)}</li>`).join('')}</ul>`);
                    continue;
                }
                // Ordered list
                if (/^\d+\.\s+/.test(line)) {
                    const items = [];
                    while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
                        items.push(lines[i].replace(/^\d+\.\s+/, ''));
                        i++;
                    }
                    out.push(`<ol>${items.map(it => `<li>${inlineMd(it)}</li>`).join('')}</ol>`);
                    continue;
                }
                // Blank line breaks paragraphs
                if (line.trim() === '') { i++; continue; }
                // Paragraph (gather consecutive non-blank lines)
                const para = [];
                while (i < lines.length && lines[i].trim() !== '' &&
                       !/^(#{1,3})\s+/.test(lines[i]) &&
                       !/^[-*]\s+/.test(lines[i]) &&
                       !/^\d+\.\s+/.test(lines[i]) &&
                       !/^>\s+/.test(lines[i])) {
                    para.push(lines[i]);
                    i++;
                }
                out.push(`<p>${inlineMd(para.join(' '))}</p>`);
            }
            return out.join('\n');
        }
        function inlineMd(s) {
            // Escape first
            let t = escapeHtml(s);
            // links [text](url)
            t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => {
                // sanitize url scheme — allow http(s), mailto, relative
                if (!/^(https?:|mailto:|\/)/i.test(url)) return text;
                return `<a href="${url}" rel="noopener noreferrer" target="_blank">${text}</a>`;
            });
            // **bold**
            t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // *italic*
            t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
            // `code`
            t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
            return t;
        }

        async function loadList() {
            // 2026-05-20 resilience fix: the FEATURED static deep guides
            // (the 12 §0.8.1-anchored patient education pages) must always
            // render so the patient can navigate to them — independent of
            // whether the /api/v1/patient/education endpoint succeeds.
            // The endpoint is intermittently 503-flaky under Workers CPU
            // pressure and the prior behavior of replacing the entire grid
            // with "Could not load library:" left the patient stranded.
            //
            // Render FEATURED first, ALWAYS. Then attempt to enrich with
            // D1-driven materials; if that fails, log + leave the FEATURED
            // grid intact with a small non-blocking notice.
            renderTags();
            renderGrid();
            try {
                const data = await fetchJson('/api/v1/patient/education');
                state.materials = data.materials || [];
                state.allTags.clear();
                state.materials.forEach(m => (m.topic_tags || []).forEach(t => state.allTags.add(t)));
                renderTags();
                renderGrid();
            } catch (e) {
                if (e.status === 401) {
                    window.location.href = '/portal/login?next=' + encodeURIComponent(location.pathname);
                    return;
                }
                // Non-blocking notice; FEATURED stays visible.
                console.warn('Education list API failed (FEATURED guides still available):', e);
                const grid = $('grid');
                if (grid && !grid.querySelector('.ed-card')) {
                    // FEATURED render fell through (shouldn't happen); show old error
                    grid.innerHTML = `<div class="empty-state">Could not load library: ${escapeHtml(e.message)}</div>`;
                }
            }
        }

        function renderTags() {
            const bar = $('tag-filter');
            // Keep the "All" chip; append per-tag chips.
            bar.innerHTML = `<button class="filter-chip${state.filterTag === '' ? ' active' : ''}" data-tag="">All</button>` +
                Array.from(state.allTags).sort().map(t =>
                    `<button class="filter-chip${state.filterTag === t ? ' active' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`
                ).join('');
            bar.querySelectorAll('.filter-chip').forEach(c => {
                c.addEventListener('click', () => {
                    state.filterTag = c.getAttribute('data-tag') || '';
                    renderTags();
                    renderGrid();
                });
            });
        }

        function renderGrid() {
            const matches = state.filterTag
                ? state.materials.filter(m => (m.topic_tags || []).includes(state.filterTag))
                : state.materials;
            // NOTE: FEATURED deep guides (the 12 §0.8.1 KB-anchored static
            // pages at /portal/education/<slug>/) always render. The D1
            // matches list appends below — empty is fine, that just means
            // there are no clinician-published custom primers yet.
            // Featured static "deep guide" pages — full peer-reviewed
            // patient education, KB-anchored per §0.8.1. These live as
            // standalone routes alongside the API-driven materials list.
            const FEATURED = [
                {
                    slug: 'endometriosis',
                    href: '/portal/education/endometriosis/',
                    title: 'Endometriosis — what it is, why it hurts, what we can do',
                    summary: 'The full guide: every treatment option from NSAIDs to laparoscopic excision, how osteopathic care fits in, and the most common patient questions — with peer-reviewed citations and verbatim PubMed abstracts.',
                    topic_tags: ['Endometriosis', 'CPP', 'OMT'],
                },
                {
                    slug: 'chronic-pelvic-pain',
                    href: '/portal/education/chronic-pelvic-pain/',
                    title: 'Chronic pelvic pain — why it&rsquo;s rarely one thing',
                    summary: 'The four overlapping layers of CPP (organs, pelvic floor, nerves, fascia), how each is worked up, and the multi-modal treatment ladder — medical, pelvic-floor PT, osteopathic, surgical — that gets most women better. Every claim cited, every abstract included.',
                    topic_tags: ['CPP', 'OMT', 'Pelvic Floor PT'],
                },
                {
                    slug: 'abnormal-uterine-bleeding',
                    href: '/portal/education/abnormal-uterine-bleeding/',
                    title: 'Abnormal uterine bleeding — what&rsquo;s normal, what isn&rsquo;t, what to do',
                    summary: 'The PALM&ndash;COEIN framework, the layered workup (TVUS, sonohysterography, biopsy, hysteroscopy), and the full medical and procedural treatment ladder — NSAIDs, tranexamic acid, hormones, LNG-IUD, hysteroscopic polypectomy or myomectomy, endometrial ablation. With every claim cited and every abstract included.',
                    topic_tags: ['AUB', 'HMB', 'Fibroids'],
                },
                {
                    slug: 'menopause',
                    href: '/portal/education/menopause/',
                    title: 'Menopause — what&rsquo;s happening, what&rsquo;s normal, what we can do',
                    summary: 'Stages, symptoms (vasomotor, GSM, mood, bone, cardiovascular), and the modern evidence on hormone therapy in 2026 &mdash; including fezolinetant, paroxetine, vaginal estrogen, and bisphosphonates. The WHI story re-told with 18-year follow-up. Cited and abstract-linked throughout.',
                    topic_tags: ['Menopause', 'MHT', 'GSM', 'Bone'],
                },
                {
                    slug: 'fibroids',
                    href: '/portal/education/fibroids/',
                    title: 'Uterine fibroids — what they are, what they do, what we can do about them',
                    summary: 'The FIGO Types 0&ndash;8 system, what each type does, and how it shapes treatment. Medical, hysteroscopic, laparoscopic myomectomy, UAE, hysterectomy &mdash; the full uterus-preserving and definitive menu. Fertility, sarcoma risk, and the disparities in fibroid care for Black women, addressed honestly.',
                    topic_tags: ['Fibroids', 'HMB', 'Myomectomy'],
                },
                {
                    slug: 'dysmenorrhea',
                    href: '/portal/education/dysmenorrhea/',
                    title: 'Painful periods — what&rsquo;s normal, what isn&rsquo;t, what to do',
                    summary: 'Primary vs secondary dysmenorrhea, the workup, and the full ladder &mdash; NSAIDs, hormonal suppression, pelvic-floor PT, osteopathic care, GnRH antagonists, surgery. When to suspect endometriosis or adenomyosis as the underlying cause.',
                    topic_tags: ['Dysmenorrhea', 'CPP', 'Endometriosis'],
                },
                {
                    slug: 'adenomyosis',
                    href: '/portal/education/adenomyosis/',
                    title: 'Adenomyosis — the often-missed cause of heavy painful periods',
                    summary: 'Diffuse vs focal disease, imaging-based diagnosis (TVUS MUSA + MRI junctional zone), and the full medical and surgical treatment ladder &mdash; LNG-IUD, GnRH antagonists, focal adenomyomectomy with delivery planning, hysterectomy when needed.',
                    topic_tags: ['Adenomyosis', 'HMB', 'Dysmenorrhea'],
                },
                {
                    slug: 'pcos',
                    href: '/portal/education/pcos/',
                    title: 'PCOS — what it is, what it does, what changes the trajectory',
                    summary: 'Rotterdam diagnostic criteria, phenotypes A&ndash;D, and the full management menu &mdash; lifestyle, metformin, GLP-1 agonists, COC, spironolactone, letrozole for ovulation induction. Plus the lifespan surveillance for diabetes, cardiovascular risk, and endometrial cancer.',
                    topic_tags: ['PCOS', 'Metabolic', 'Fertility'],
                },
                {
                    slug: 'ovarian-masses',
                    href: '/portal/education/ovarian-masses/',
                    title: 'Ovarian cysts &amp; adnexal masses — when to watch, when to operate',
                    summary: 'Types (functional, dermoid, endometrioma, cystadenoma, malignant), the modern workup (TVUS + IOTA risk-stratification, selective CA-125), watch vs operate decision-tree, cystectomy vs oophorectomy, BRCA / hereditary risk and risk-reducing surgery.',
                    topic_tags: ['Ovarian cysts', 'BRCA', 'Surgery'],
                },
                {
                    slug: 'postoperative-recovery',
                    href: '/portal/education/postoperative-recovery/',
                    title: 'After your surgery — what to expect, what to do, what to watch for',
                    summary: 'ERAS-based recovery timeline (week before, day of, days 1&ndash;7, weeks 2&ndash;6), opioid-sparing pain control, medication holds (GLP-1s, anticoagulants, herbs), and the four things that drive most post-op calls &mdash; constipation, pain, urinary, bleeding.',
                    topic_tags: ['Post-op', 'ERAS', 'Recovery'],
                },
                {
                    slug: 'contraception',
                    href: '/portal/education/contraception/',
                    title: 'Contraception — the full menu, what fits your life',
                    summary: 'The full effectiveness tier hierarchy &mdash; LARC, hormonal short-acting, barriers, behavioral, emergency contraception, permanent contraception. US MEC 2024 for medical conditions, life-stage considerations, shared-decision-making framing.',
                    topic_tags: ['Contraception', 'LARC', 'EC'],
                },
                {
                    slug: 'pregnancy-loss',
                    href: '/portal/education/pregnancy-loss/',
                    title: 'Pregnancy loss — what&rsquo;s happening, what&rsquo;s normal, what comes next',
                    summary: 'A trauma-informed walkthrough of early pregnancy loss &mdash; diagnosis, the three management options (expectant, medical mife+miso, surgical), ectopic pregnancy, recurrent loss workup, and the emotional and mental-health support that matters as much as the medical care.',
                    topic_tags: ['Pregnancy loss', 'Grief', 'Recurrent loss'],
                },
            ];
            // Respect the active tag filter for FEATURED too.
            const featuredFiltered = state.filterTag
                ? FEATURED.filter(f => f.topic_tags.includes(state.filterTag))
                : FEATURED;
            // 2026-05-20 patient-portal fix: every slug in FEATURED also
            // has a corresponding D1 education_materials row seeded with
            // r2_key pointing at the same static HTML file. Without this
            // filter the listing showed each topic twice — once as the
            // working FEATURED card, once as a D1 card that opened the
            // raw HTML source in the reader modal. Suppress the D1
            // duplicates so the patient sees one card per topic.
            const featuredSlugs = new Set(FEATURED.map(f => f.slug));
            const matchesDeduped = matches.filter(m => !featuredSlugs.has(m.slug));
            const featuredHtml = featuredFiltered.map(f => {
                const tagChips = f.topic_tags.map(t => `<span class="ed-tag">${escapeHtml(t)}</span>`).join('');
                return `
                    <a class="ed-card ed-featured" href="${escapeHtml(f.href)}" style="border-color: rgba(var(--glow-purple), 0.55); background: rgba(var(--glow-purple), 0.06);">
                        <div class="ed-badge-row"><span class="badge badge-new" style="background: rgba(var(--glow-purple), 0.20); color: var(--accent-soft);">Deep Guide</span></div>
                        <h3>${escapeHtml(f.title)}</h3>
                        <p class="ed-summary">${escapeHtml(f.summary)}</p>
                        <div class="ed-meta">${tagChips}</div>
                    </a>
                `;
            }).join('');
            $('grid').innerHTML = featuredHtml + matchesDeduped.map(m => {
                const completed = m.view && m.view.completed;
                const seen = m.view && m.view.view_count > 0;
                const badges = [];
                if (m.assignment) badges.push('<span class="badge badge-assigned">Assigned</span>');
                if (completed) badges.push('<span class="badge badge-completed">✓ Done</span>');
                else if (!seen) badges.push('<span class="badge badge-new">New</span>');
                const tagChips = (m.topic_tags || []).slice(0, 3).map(t => `<span class="ed-tag">${escapeHtml(t)}</span>`).join('');
                return `
                    <a class="ed-card" data-slug="${escapeHtml(m.slug)}" href="#">
                        ${badges.length ? `<div class="ed-badge-row">${badges.join('')}</div>` : ''}
                        <h3>${escapeHtml(m.title)}</h3>
                        <p class="ed-summary">${escapeHtml(m.summary || '')}</p>
                        <div class="ed-meta">${tagChips}</div>
                    </a>
                `;
            }).join('');
            // Only the D1 cards (with data-slug) call openMaterial.
            // FEATURED cards have a real href and route by normal navigation.
            $('grid').querySelectorAll('.ed-card[data-slug]').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    openMaterial(el.getAttribute('data-slug'));
                });
            });
            // Empty-state message ONLY when both FEATURED and D1 returned nothing
            // (which can only happen if the tag filter excludes every guide).
            if (!featuredFiltered.length && !matchesDeduped.length) {
                $('grid').innerHTML = '<div class="empty-state">No primers in this view yet. Try clearing the topic filter.</div>';
            }
        }

        async function openMaterial(slug) {
            try {
                const data = await fetchJson(`/api/v1/patient/education/${encodeURIComponent(slug)}`);
                // 2026-05-20 patient-portal "I only see html view" fix:
                // some D1 education_materials rows reference a complete
                // static HTML file via r2_key (e.g. the 12 §0.8.1-anchored
                // patient education guides). The API surfaces those via
                // a `static_path` hint. When present, route the browser
                // straight to the canonical static URL rather than trying
                // to render the HTML through the markdown reader (which
                // would escape every angle bracket and show the source
                // as text).
                if (data && data.static_path) {
                    window.location.href = data.static_path;
                    return;
                }
                state.currentSlug = slug;
                state.currentMaterial = data;
                $('r-title').textContent = data.material.title;
                $('r-summary').textContent = data.material.summary || '';
                const tagsHtml = (data.material.topic_tags || []).map(t => `<span class="ed-tag">${escapeHtml(t)}</span>`).join('');
                $('r-meta').innerHTML = tagsHtml + (data.assignment ? ' · <span style="color:rgba(252,211,77,0.92);">Assigned to you</span>' : '');
                $('r-prose').innerHTML = renderMarkdown(data.material.body_md || '');
                // Completion state
                const inList = state.materials.find(m => m.slug === slug);
                const completed = inList && inList.view && inList.view.completed;
                renderCompleteState(completed);
                $('list-view').style.display = 'none';
                $('reader-view').classList.add('open');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (e) {
                alert('Could not open: ' + e.message);
            }
        }
        function renderCompleteState(completed) {
            $('btn-complete').style.display = completed ? 'none' : 'inline-block';
            $('btn-incomplete').style.display = completed ? 'inline-block' : 'none';
            $('complete-status').textContent = completed
                ? "Marked complete. Tap Mark not done to clear."
                : "Once you've read this through, tap Mark complete so your clinician sees you finished it.";
        }
        async function setComplete(completed) {
            try {
                await fetchJson(`/api/v1/patient/education/${encodeURIComponent(state.currentSlug)}`, {
                    method: 'POST',
                    body: JSON.stringify({ completed }),
                });
                // Update local list cache.
                const m = state.materials.find(x => x.slug === state.currentSlug);
                if (m) {
                    m.view = m.view || { view_count: 1, first_viewed_at: Date.now(), last_viewed_at: Date.now() };
                    m.view.completed = completed ? 1 : 0;
                }
                renderCompleteState(completed);
            } catch (e) {
                alert('Could not update: ' + e.message);
            }
        }

        $('btn-back').addEventListener('click', () => {
            $('reader-view').classList.remove('open');
            $('list-view').style.display = 'block';
            renderGrid();
            window.scrollTo({ top: 0 });
        });
        $('btn-complete').addEventListener('click', () => setComplete(true));
        $('btn-incomplete').addEventListener('click', () => setComplete(false));

        loadList();
    </script>
</body>
</html>
