<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sign in · Member Portal · Mount Zara</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07070a;
            --fg-strong: #ffffff;
            --fg-mid: rgba(245, 245, 247, 0.84);
            --fg-soft: rgba(245, 245, 247, 0.62);
            --accent: #6d28d9;
            --accent-soft: #a78bfa;
            --glow-purple: 167, 139, 250;
            --red: #ef4444;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(var(--glow-purple), 0.18), transparent 60%),
                var(--bg-base);
            color: var(--fg-mid);
            font-family: 'Avenir Next', 'Avenir', 'Nunito Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            font-feature-settings: "ss01", "cv11";
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            display: flex; align-items: center; justify-content: center;
        }
        a { color: var(--accent-soft); text-decoration: none; transition: color 0.2s ease; }
        a:hover { color: var(--fg-strong); }
        main {
            width: min(440px, 100%);
            padding: clamp(28px, 6vw, 48px);
            animation: mzRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .nav-back {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 13px; color: var(--fg-soft);
            margin-bottom: 28px;
        }
        .nav-back::before { content: "\2190"; font-size: 14px; }
        .eyebrow {
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.22em; text-transform: uppercase;
            color: rgba(var(--glow-purple), 0.95);
            margin-bottom: 16px;
        }
        h1 {
            font-weight: 200;
            font-size: clamp(28px, 4.2vw, 38px);
            letter-spacing: -0.022em;
            line-height: 1.1;
            color: var(--fg-strong);
            margin: 0 0 14px 0;
        }
        .lede {
            font-size: 15px; line-height: 1.6;
            color: var(--fg-soft);
            margin: 0 0 28px 0;
        }
        form {
            display: flex; flex-direction: column; gap: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 14px;
            backdrop-filter: blur(28px) saturate(165%);
            -webkit-backdrop-filter: blur(28px) saturate(165%);
            padding: 22px;
        }
        label {
            font-size: 12px; font-weight: 600;
            color: var(--fg-mid);
            letter-spacing: 0.02em;
            display: flex; flex-direction: column; gap: 6px;
        }
        input[type=email],
        input[type=password] {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            color: var(--fg-strong);
            font: inherit; font-size: 15px;
            transition: border-color 0.22s ease, background 0.22s ease;
        }
        input[type=email]:focus,
        input[type=password]:focus {
            outline: none;
            border-color: rgba(var(--glow-purple), 0.65);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(var(--glow-purple), 0.18);
        }
        button {
            width: 100%;
            padding: 13px 16px;
            background: linear-gradient(180deg, var(--accent-soft) 0%, var(--accent) 100%);
            color: #fff;
            font: inherit; font-size: 15px; font-weight: 600;
            letter-spacing: 0.02em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            margin-top: 6px;
        }
        button:hover { filter: brightness(1.07); transform: translateY(-1px); box-shadow: 0 8px 24px -8px rgba(var(--glow-purple), 0.55); }
        button:active { transform: none; }
        button[disabled] { opacity: 0.5; cursor: not-allowed; filter: none; transform: none; }
        .msg {
            font-size: 13.5px; line-height: 1.55;
            padding: 10px 12px;
            border-radius: 8px;
            display: none;
        }
        .msg.error {
            display: block;
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.32);
            color: rgba(252, 165, 165, 0.95);
        }
        .alt {
            margin-top: 18px;
            font-size: 13px;
            color: var(--fg-soft);
            text-align: center;
        }
        @keyframes mzRise {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    
        /* Fixed finalized hero line-art backdrop (static — does NOT play) so the
           glass dashboard components frost against real texture, uniform with the
           rest of the site. Move the opaque page base to html so the z-index:-1
           art shows; body keeps only its translucent glow on top. Added 2026-06-29. */
        html { background-color: var(--bg-base, var(--bg, var(--black, #07070a))); }
        body { background-color: transparent !important; }
        .page-bg-stage { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: #000; opacity: 0.75; }
        .page-bg-art { position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; object-fit: contain; pointer-events: none; filter: saturate(2.0) brightness(1.28) contrast(1.28); transform: translate(-48%, -50%) rotate(-22deg) scale(2.09); }
    </style>
</head>
<body>
    <div class="page-bg-stage" aria-hidden="true"><img class="page-bg-art" src="https://mountzara.com/media/hero-last-frame-v2.webp" alt=""></div>
    <main>
        <a class="nav-back" href="/portal/">Back to portal</a>
        <p class="eyebrow">Member Portal &middot; Sign In</p>
        <h1>Welcome back.</h1>
        <p class="lede">Sign in with the email and password you used to sign up. Magic-link sign-in is coming soon.</p>
        <form id="loginForm" autocomplete="on">
            <label>Email
                <input type="email" id="email" name="email" autocomplete="username" required>
            </label>
            <label>Password
                <input type="password" id="password" name="password" autocomplete="current-password" required minlength="12">
            </label>
            <div id="msg" class="msg" role="alert" aria-live="polite"></div>
            <button type="submit" id="submitBtn">Sign in</button>
            <p class="alt"><a href="/portal/magic-link/">Sign in with a one-time link instead</a></p>
            <p class="alt">No account yet? <a href="/portal/signup/">Create one</a>.</p>
        </form>
    </main>
    <script>
        const form = document.getElementById('loginForm');
        const msg = document.getElementById('msg');
        const submitBtn = document.getElementById('submitBtn');
        function showError(text) {
            msg.textContent = text;
            msg.className = 'msg error';
        }
        function clearMsg() { msg.className = 'msg'; msg.textContent = ''; }
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMsg();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in…';
            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value,
                    }),
                });
                if (res.ok) {
                    location.href = '/portal/profile/';
                    return;
                }
                if (res.status === 401) { showError('Invalid email or password.'); }
                else if (res.status === 404) { showError('Sign-in is not yet open to the public.'); }
                else {
                    const body = await res.json().catch(() => ({}));
                    showError(body.message || 'Sign-in failed. Please try again.');
                }
            } catch (err) {
                showError('Network error. Check your connection and try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
