<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Create an account · Member Portal · Mount Zara</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #FBFAF8;
            --fg-strong: #1A1726;
            --fg-mid: #4A4658;
            --fg-soft: #6E6A7C;
            --accent: #6d28d9;
            --accent-soft: #7c3aed;
            --glow-purple: 167, 139, 250;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(var(--glow-purple), 0.18), transparent 60%),
                var(--bg-base);
            color: var(--fg-mid);
            font-family: 'Avenir Next', 'Avenir', 'Nunito Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            display: flex; align-items: center; justify-content: center;
            padding: clamp(20px, 4vw, 40px);
        }
        a { color: var(--accent-soft); text-decoration: none; transition: color 0.2s ease; }
        a:hover { color: var(--fg-strong); }
        main {
            width: min(520px, 100%);
            animation: mzRise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .nav-back { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-soft); margin-bottom: 24px; }
        .nav-back::before { content: "\2190"; font-size: 14px; }
        .eyebrow {
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.22em; text-transform: uppercase;
            color: #6d28d9;
            margin-bottom: 14px;
        }
        h1 {
            font-weight: 200;
            font-size: clamp(28px, 4.2vw, 38px);
            letter-spacing: -0.022em;
            line-height: 1.1;
            color: var(--fg-strong);
            margin: 0 0 14px 0;
        }
        .lede {
            font-size: 15px; line-height: 1.6;
            color: var(--fg-soft);
            margin: 0 0 24px 0;
        }
        form {
            display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
            background: rgba(255,255,255,0.72);
            border: 1px solid #E9E5EE;
            border-radius: 14px;
            backdrop-filter: blur(28px) saturate(165%);
            -webkit-backdrop-filter: blur(28px) saturate(165%);
            padding: 22px;
        }
        @media (max-width: 540px) { form { grid-template-columns: 1fr; } }
        label.full { grid-column: 1 / -1; }
        label {
            font-size: 12px; font-weight: 600;
            color: var(--fg-mid);
            letter-spacing: 0.02em;
            display: flex; flex-direction: column; gap: 6px;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255,255,255,0.72);
            border: 1px solid #E9E5EE;
            border-radius: 10px;
            color: var(--fg-strong);
            font: inherit; font-size: 15px;
            transition: border-color 0.22s ease, background 0.22s ease;
        }
        input:focus {
            outline: none;
            border-color: #6d28d9;
            background: rgba(255,255,255,0.72);
            box-shadow: 0 0 0 3px rgba(var(--glow-purple), 0.18);
        }
        .hint {
            font-size: 11.5px;
            color: var(--fg-soft);
            font-weight: 400;
            letter-spacing: 0;
        }
        .actions { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
        button {
            width: 100%;
            padding: 13px 16px;
            background: linear-gradient(180deg, var(--accent-soft) 0%, var(--accent) 100%);
            color: #fff;
            font: inherit; font-size: 15px; font-weight: 600;
            letter-spacing: 0.02em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        }
        button:hover { filter: brightness(1.07); transform: translateY(-1px); box-shadow: 0 8px 24px -8px rgba(var(--glow-purple), 0.55); }
        button[disabled] { opacity: 0.5; cursor: not-allowed; filter: none; transform: none; }
        .msg { font-size: 13.5px; line-height: 1.55; padding: 10px 12px; border-radius: 8px; display: none; }
        .msg.error { display: block; background: rgba(239, 68, 68, 0.10); border: 1px solid rgba(239, 68, 68, 0.32); color: #B91C1C; }
        .msg.ok { display: block; background: rgba(16, 185, 129, 0.10); border: 1px solid rgba(16, 185, 129, 0.32); color: #047857; }
        .alt { font-size: 13px; color: var(--fg-soft); text-align: center; }
        @keyframes mzRise {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    
        /* Fixed finalized hero line-art backdrop (static — does NOT play) so the
           glass dashboard components frost against real texture, uniform with the
           rest of the site. Move the opaque page base to html so the z-index:-1
           art shows; body keeps only its translucent glow on top. Added 2026-06-29. */
        html { background:
            radial-gradient(110vmax 80vmax at 82% -10%, rgba(139, 92, 246, 0.09), transparent 62%),
            radial-gradient(90vmax 70vmax at 4% 112%, rgba(109, 40, 217, 0.07), transparent 58%),
            linear-gradient(178deg, #FDFCFB 0%, #FBFAF8 55%, #F6F3EF 100%);
            /* 2026-07-28 — explicit plum canvas. The old var-fallback chain
               bottomed out at legacy #FBFAF8 black on pages whose tokens
               didn't resolve, leaving flat near-black canvases (user-caught
               on /curriculum/; survey found 16 such pages). */ }
        body { background-color: transparent !important; }
        .page-bg-stage { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: transparent; /* was opaque #000 — hid the plum body (2026-07-28 sweep) */ opacity: 0.42; /* 2026-08-08 — was 0.75: at desktop widths the saturate(2.0)-boosted strokes crossed naked headings/ledes at near-full strength and made them unreadable (user: 'why did you allow this page to be live'). The art stays present as texture; text wins. */ }
        .page-bg-art { position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; object-fit: contain; pointer-events: none; filter: none; mix-blend-mode: multiply; -webkit-mask-image: radial-gradient(140% 140% at 50% 50%, #000 48%, transparent 74%); mask-image: radial-gradient(140% 140% at 50% 50%, #000 48%, transparent 74%); /* 2026-08-08 — feather the image rectangle: its hard bounding-box edge crossed tall mobile pages as a diagonal seam that read as a rendering glitch */ transform: translate(-48%, -50%) rotate(-22deg) scale(2.09); }
    
/* ===== 2026-08-08 accessibility pass (measured, not assumed) =====
   Audit found: contrast failures concentrated on translucent "light" panels,
   nav/footer links 15-20px tall, carousel pips 7x7px, and a skip link that
   itself failed contrast. WCAG 2.5.8 wants a 24x24 minimum target; 2.4.7
   wants a visible focus indicator; 1.4.3 wants 4.5:1 on body text. */
nav a, .site-nav a, .main-nav a, footer a, .foot a, .footer-content a,
.nav-back, .nav-brand, .brand, .crumb a {
    min-height: 24px;
    display: inline-flex;
    align-items: center;
}
/* Pips keep their small dot but get a real 24px hit area via padding. */
.mz-grid-pip, .carousel-pip, [class*="-pip"] {
    min-width: 24px;
    min-height: 24px;
    padding: 8px;
    background-clip: content-box;
    box-sizing: border-box;
}
.mobile-toggle, .nav-toggle, [class*="menu-toggle"] {
    min-width: 44px;
    min-height: 44px;
}
/* Focus must be visible on every interactive element, on any background. */
a:focus-visible, button:focus-visible, [role="button"]:focus-visible,
summary:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid #6d28d9;
    outline-offset: 2px;
    border-radius: 6px;
}
/* The skip link was white on light purple (2.96:1). Dark plum ground = 13:1. */
.skip-link {
    background: #2e1065 !important;
    color: #ffffff !important;
    border: 1px solid #6d28d9;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>
<body>
    <div class="page-bg-stage" aria-hidden="true"><img class="page-bg-art" src="https://mountzara.com/media/hero-last-frame-ink-v2.webp" alt=""></div>
    <main>
        <a class="nav-back" href="/portal/">Back to portal</a>
        <p class="eyebrow">Member Portal &middot; Create an Account</p>
        <h1>Let&rsquo;s get you set up.</h1>
        <p class="lede">A few essentials to create your account. After this, you&rsquo;ll be guided through the comprehensive intake when you&rsquo;re ready &mdash; it autosaves, so you can pause anytime.</p>
        <form id="signupForm" autocomplete="on">
            <label>First name
                <input type="text" id="first_name" name="first_name" required autocomplete="given-name">
            </label>
            <label>Last name
                <input type="text" id="last_name" name="last_name" required autocomplete="family-name">
            </label>
            <label class="full">Email
                <input type="email" id="email" name="email" required autocomplete="email">
            </label>
            <label class="full">Date of birth
                <input type="date" id="dob" name="dob" required autocomplete="bday">
            </label>
            <label class="full">Password <span class="hint">&mdash; at least 12 characters</span>
                <input type="password" id="password" name="password" required minlength="12" autocomplete="new-password">
            </label>
            <label class="full" style="display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:1.55; font-weight:400;">
                <input type="checkbox" id="ack-legal" required style="margin-top:3px; width:auto; min-height:0;">
                <span>I have had the opportunity to review the
                <a href="/privacy-practices/" target="_blank" rel="noopener">Notice of Privacy Practices</a>,
                the <a href="/terms/" target="_blank" rel="noopener">Terms of Use</a> and the
                <a href="/privacy/" target="_blank" rel="noopener">Privacy Policy</a>.
                <span style="opacity:.65">You can also receive care without a portal account by
                contacting the practice at info@mountzara.com.</span></span>
            </label>
            <div class="actions">
                <div id="msg" class="msg" role="alert" aria-live="polite"></div>
                <button type="submit" id="submitBtn">Create account</button>
                <p class="alt">Already have an account? <a href="/portal/login/">Sign in</a>.</p>
            </div>
        </form>
    </main>
    <script>
        const form = document.getElementById('signupForm');
        const msg = document.getElementById('msg');
        const submitBtn = document.getElementById('submitBtn');
        function showError(t) { msg.textContent = t; msg.className = 'msg error'; }
        function showErrorHtml(html) { msg.innerHTML = html; msg.className = 'msg error'; }
        function showOk(t) { msg.textContent = t; msg.className = 'msg ok'; }
        function clearMsg() { msg.className = 'msg'; msg.textContent = ''; }
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMsg();
            let created = false;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account…';
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Chicago';
                const res = await fetch('/api/v1/auth/signup', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({
                        acknowledge_legal: document.getElementById('ack-legal').checked,
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value,
                        first_name: document.getElementById('first_name').value.trim(),
                        last_name: document.getElementById('last_name').value.trim(),
                        dob: document.getElementById('dob').value,
                        timezone: tz,
                    }),
                });
                if (res.status === 201) {
                    // The page promised the health history and used to land on
                    // /portal/profile/ — the one page a brand-new member has no
                    // reason to open. Confirm inline, then go where we said.
                    created = true;
                    const firstName = document.getElementById('first_name').value.trim();
                    showOk("You're in, " + firstName + '. Taking you to your health history now.');
                    submitBtn.textContent = 'Account created';
                    setTimeout(() => { location.href = '/portal/intake/?welcome=1'; }, 1500);
                    return;
                }
                if (res.status === 409) {
                    showError('An account already exists for that email. Try signing in instead.');
                } else if (res.status === 404) {
                    // Pre-launch: /api/v1/auth/signup 404s while
                    // PORTAL_PUBLIC_LAUNCH is off. The waitlist form lives on
                    // the Coming Soon page the middleware serves at /portal/.
                    showErrorHtml("The portal isn't open to new members yet. "
                        + '<a href="/portal/">Join the waitlist</a>'
                        + " and we'll email you the moment it opens.");
                } else {
                    showError("We couldn't create your account with those details. Check your email address and date of birth, then try again.");
                }
            } catch (err) {
                showError("We couldn't reach the server. Check your connection and try again.");
            } finally {
                if (!created) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create account';
                }
            }
        });
    </script>
<style id="mz-canvas-guard">html{background-color:#FBFAF8}</style>
</body>
</html>
