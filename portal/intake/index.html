<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Intake · Member Portal · Mount Zara</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #120b22;
            --fg-strong: #ffffff;
            --fg-mid: #ffffff;
            --fg-soft: #ffffff;
            --fg-dim: #ffffff;
            --accent: #6d28d9;
            --accent-soft: #a78bfa;
            --glow-purple: 167, 139, 250;
            --green: #10b981;
            --amber: #f59e0b;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(var(--glow-purple), 0.12), transparent 60%),
                var(--bg-base);
            color: var(--fg-mid);
            font-family: 'Avenir Next', 'Avenir', 'Nunito Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            font-feature-settings: "ss01", "cv11";
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--accent-soft); text-decoration: none; }
        a:hover { color: var(--fg-strong); }
        .wrap { display: grid; grid-template-columns: 280px 1fr; gap: 28px; max-width: 1280px; margin: 0 auto; padding: clamp(20px, 4vw, 40px); }
        @media (max-width: 920px) { .wrap { grid-template-columns: 1fr; } }
        .top-row { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--fg-soft); margin-bottom: 8px; }
        button.text-btn { background: none; border: none; padding: 6px 10px; border-radius: 8px; color: var(--fg-soft); font: inherit; font-size: 13px; cursor: pointer; transition: background 0.18s ease, color 0.18s ease; }
        button.text-btn:hover { color: var(--fg-strong); background: rgba(var(--glow-purple), 0.10); }

        /* SIDEBAR */
        aside.toc {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 14px;
            backdrop-filter: blur(28px) saturate(165%);
            -webkit-backdrop-filter: blur(28px) saturate(165%);
            padding: 18px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        .toc-title { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(var(--glow-purple), 0.95); margin-bottom: 12px; }
        .progress {
            display: flex; align-items: center; gap: 10px;
            font-size: 13px; color: var(--fg-soft);
            margin-bottom: 14px;
        }
        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-bar > span {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-soft), var(--accent));
            width: 0%;
            transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .toc-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
        .toc-list li button {
            width: 100%;
            text-align: left;
            font: inherit;
            font-size: 13.5px;
            background: none;
            border: none;
            color: var(--fg-soft);
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            transition: background 0.18s ease, color 0.18s ease;
        }
        .toc-list li button:hover { background: rgba(var(--glow-purple), 0.08); color: var(--fg-strong); }
        .toc-list li button.active { background: rgba(var(--glow-purple), 0.14); color: var(--fg-strong); }
        .toc-list .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(245, 245, 247, 0.20); flex-shrink: 0; }
        .toc-list .done .dot { background: var(--green); }
        .toc-list .active .dot { background: var(--accent-soft); box-shadow: 0 0 0 3px rgba(var(--glow-purple), 0.22); }

        /* MAIN */
        main.body { min-width: 0; }
        .header h1 {
            font-weight: 200;
            font-size: clamp(26px, 3.4vw, 34px);
            letter-spacing: -0.022em;
            line-height: 1.1;
            color: var(--fg-strong);
            margin: 0 0 8px 0;
        }
        .header .lede { font-size: 15px; line-height: 1.6; color: var(--fg-soft); max-width: 60ch; margin: 0 0 20px 0; }
        .save-status {
            position: fixed;
            bottom: 22px; right: 22px;
            padding: 8px 14px;
            background: rgba(7, 7, 10, 0.85);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 999px;
            font-size: 12.5px;
            color: var(--fg-soft);
            z-index: 50;
            opacity: 0;
            transition: opacity 0.22s ease;
        }
        .save-status.show { opacity: 1; }
        .save-status.ok { color: rgba(110, 231, 183, 0.95); border-color: rgba(16, 185, 129, 0.35); }
        .save-status.err { color: rgba(252, 165, 165, 0.95); border-color: rgba(239, 68, 68, 0.35); }

        section.panel {
            display: none;
            animation: mzRise 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        section.panel.active { display: block; }
        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 14px;
            backdrop-filter: blur(28px) saturate(165%);
            -webkit-backdrop-filter: blur(28px) saturate(165%);
            padding: 24px;
            margin-bottom: 16px;
        }
        .card h2 {
            font-size: 13px; font-weight: 700;
            letter-spacing: 0.18em; text-transform: uppercase;
            color: rgba(var(--glow-purple), 0.92);
            margin: 0 0 4px 0;
        }
        .card h3 {
            font-weight: 300;
            font-size: clamp(22px, 2.4vw, 26px);
            letter-spacing: -0.012em;
            color: var(--fg-strong);
            margin: 0 0 8px 0;
        }
        .card .desc { font-size: 14px; line-height: 1.6; color: var(--fg-soft); margin: 0 0 20px 0; max-width: 64ch; }
        .card .subhead {
            font-size: 12.5px; font-weight: 600;
            letter-spacing: 0.06em; text-transform: uppercase;
            color: rgba(var(--glow-purple), 0.95);
            margin: 22px 0 10px 0;
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
        label {
            font-size: 12.5px; font-weight: 600;
            color: var(--fg-mid);
            letter-spacing: 0.01em;
            display: flex; flex-direction: column; gap: 6px;
        }
        label.full { grid-column: 1 / -1; }
        label .hint { font-size: 11.5px; font-weight: 400; color: var(--fg-dim); letter-spacing: 0; }
        input[type=text], input[type=email], input[type=tel], input[type=date],
        input[type=number], select, textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 9px;
            color: var(--fg-strong);
            font: inherit; font-size: 14px;
            transition: border-color 0.22s ease, background 0.22s ease;
        }
        textarea { resize: vertical; min-height: 80px; font-family: inherit; line-height: 1.5; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: rgba(var(--glow-purple), 0.65);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(var(--glow-purple), 0.18);
        }
        .check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; }
        .check {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 9px;
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease;
            font-size: 13.5px;
            font-weight: 400;
        }
        .check input { margin: 2px 0 0 0; accent-color: var(--accent); }
        .check:hover { border-color: rgba(var(--glow-purple), 0.30); }
        .check input:checked + span { color: var(--fg-strong); }
        .check.with-detail { flex-direction: column; align-items: stretch; gap: 8px; }
        .check.with-detail .row { display: flex; align-items: center; gap: 10px; }
        .check.with-detail input[type=text],
        .check.with-detail input[type=number],
        .check.with-detail input[type=date] { font-size: 13px; padding: 6px 10px; }
        .radio-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .radio-row label {
            font-size: 13px; font-weight: 500;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 999px;
            cursor: pointer;
            transition: border-color 0.18s ease, background 0.18s ease;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .radio-row label:hover { border-color: rgba(var(--glow-purple), 0.40); }
        .radio-row input { accent-color: var(--accent); }
        .radio-row input:checked + span { color: var(--fg-strong); }
        .radio-row label:has(input:checked) { background: rgba(var(--glow-purple), 0.12); border-color: rgba(var(--glow-purple), 0.50); }

        .footer-nav {
            display: flex; justify-content: space-between; gap: 12px;
            margin-top: 18px;
        }
        button.nav-btn {
            padding: 11px 22px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: var(--fg-strong);
            font: inherit; font-size: 14px; font-weight: 600;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
        }
        button.nav-btn:hover { background: rgba(var(--glow-purple), 0.12); border-color: rgba(var(--glow-purple), 0.40); }
        button.nav-btn[disabled] { opacity: 0.45; cursor: not-allowed; }
        button.primary {
            padding: 11px 22px;
            background: linear-gradient(180deg, var(--accent-soft) 0%, var(--accent) 100%);
            color: #fff;
            font: inherit; font-size: 14px; font-weight: 600;
            border: none; border-radius: 10px;
            cursor: pointer;
            transition: filter 0.18s ease, transform 0.18s ease;
        }
        button.primary:hover { filter: brightness(1.07); transform: translateY(-1px); }
        button[disabled] { opacity: 0.5; cursor: not-allowed; filter: none; transform: none; }

        .banner {
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.55;
            margin-bottom: 16px;
        }
        .banner.info { background: rgba(var(--glow-purple), 0.10); border: 1px solid rgba(var(--glow-purple), 0.30); color: rgba(196, 181, 253, 0.95); }
        .banner.warn { background: rgba(245, 158, 11, 0.10); border: 1px solid rgba(245, 158, 11, 0.35); color: rgba(252, 211, 77, 0.95); }
        .banner.ok   { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.30); color: rgba(110, 231, 183, 0.95); }

        @keyframes mzRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    
        /* Fixed finalized hero line-art backdrop (static — does NOT play) so the
           glass dashboard components frost against real texture, uniform with the
           rest of the site. Move the opaque page base to html so the z-index:-1
           art shows; body keeps only its translucent glow on top. Added 2026-06-29. */
        html { background:
            radial-gradient(110vmax 80vmax at 82% -10%, rgba(139, 92, 246, 0.16), transparent 60%),
            radial-gradient(90vmax 70vmax at 4% 112%, rgba(109, 40, 217, 0.12), transparent 56%),
            linear-gradient(178deg, #171030 0%, #120b22 55%, #150e2a 100%);
            /* 2026-07-28 — explicit plum canvas. The old var-fallback chain
               bottomed out at legacy #07070a black on pages whose tokens
               didn't resolve, leaving flat near-black canvases (user-caught
               on /curriculum/; survey found 16 such pages). */ }
        body { background-color: transparent !important; }
        .page-bg-stage { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: transparent; /* was opaque #000 — hid the plum body (2026-07-28 sweep) */ opacity: 0.42; /* 2026-08-08 — was 0.75: at desktop widths the saturate(2.0)-boosted strokes crossed naked headings/ledes at near-full strength and made them unreadable (user: 'why did you allow this page to be live'). The art stays present as texture; text wins. */ }
        .page-bg-art { position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; object-fit: contain; pointer-events: none; filter: saturate(1.5) brightness(1.08) contrast(1.12); mix-blend-mode: screen; transform: translate(-48%, -50%) rotate(-22deg) scale(2.09); }
    </style>
</head>
<body>
    <div class="page-bg-stage" aria-hidden="true"><img class="page-bg-art" src="https://mountzara.com/media/hero-last-frame-v2.webp" alt=""></div>
    <div class="wrap">
        <div class="top-row">
            <a href="/portal/">&larr; Member portal</a>
            <button class="text-btn" id="logoutBtn">Log out</button>
        </div>

        <aside class="toc">
            <div class="toc-title">Intake &middot; Sections</div>
            <div class="progress">
                <span id="pctLabel">0%</span>
                <div class="progress-bar"><span id="pctBar"></span></div>
            </div>
            <ul class="toc-list" id="tocList"></ul>
        </aside>

        <main class="body">
            <div class="header">
                <h1>Patient Intake</h1>
                <p class="lede">Eighteen short sections. Your work is autosaved as you type — close the tab anytime and come back to finish. The final submit button is on the last section.</p>
            </div>
            <div id="banner"></div>
            <form id="intakeForm" autocomplete="on" novalidate></form>
            <div class="footer-nav">
                <button type="button" class="nav-btn" id="prevBtn" disabled>&larr; Previous</button>
                <button type="button" class="nav-btn" id="nextBtn">Next &rarr;</button>
                <button type="button" class="primary" id="submitBtn" style="display:none">Submit intake</button>
            </div>
        </main>
    </div>

    <div class="save-status" id="saveStatus" role="status" aria-live="polite"></div>

    <script>
    // ==========================================================
    // 18 patient-facing sections (Section 3 Office Use Only skipped).
    // Each section is rendered upfront; only one is visible via CSS.
    // ==========================================================
    const SECTIONS = [
        { n: 1, key: 'patient_information', label: 'Patient Information' },
        { n: 2, key: 'consent', label: 'Consent' },
        { n: 4, key: 'chief_gynecologic_complaint', label: 'Chief Complaint' },
        { n: 5, key: 'detailed_menstrual_history', label: 'Menstrual History' },
        { n: 6, key: 'previous_gyn_treatments', label: 'Previous Treatments' },
        { n: 7, key: 'previous_gyn_surgeries', label: 'Previous Surgeries' },
        { n: 8, key: 'fertility_and_pregnancy', label: 'Fertility & Pregnancy' },
        { n: 9, key: 'sexual_function', label: 'Sexual Function' },
        { n: 10, key: 'relevant_imaging', label: 'Imaging Studies' },
        { n: 11, key: 'gi_gu_symptoms', label: 'GI / GU Symptoms' },
        { n: 12, key: 'medical_history_eras', label: 'Medical History & ERAS' },
        { n: 13, key: 'current_medications', label: 'Current Medications' },
        { n: 14, key: 'allergies', label: 'Allergies' },
        { n: 15, key: 'family_gyn_history', label: 'Family Gyn History' },
        { n: 16, key: 'social_history', label: 'Social History' },
        { n: 17, key: 'mental_health_screening', label: 'Mental Health' },
        { n: 18, key: 'social_determinants', label: 'Social Determinants' },
        { n: 19, key: 'review_of_systems', label: 'Review of Systems' },
    ];

    function h(tag, attrs, ...children) {
        const el = document.createElement(tag);
        if (attrs) for (const k of Object.keys(attrs)) {
            if (k === 'class') el.className = attrs[k];
            else if (k === 'html') el.innerHTML = attrs[k];
            else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
            else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
        }
        for (const c of children.flat()) {
            if (c == null || c === false) continue;
            el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
        }
        return el;
    }

    // Field shorthand helpers.
    function field(label, input, hint) {
        const lbl = h('label', { class: input.dataset?.full ? 'full' : '' }, label, hint ? h('span', { class: 'hint' }, hint) : null, input);
        return lbl;
    }
    function textIn(name, opts = {}) {
        const i = h('input', Object.assign({ type: 'text', name, autocomplete: 'off' }, opts));
        if (opts.full) i.dataset.full = '1';
        return i;
    }
    function numIn(name, opts = {}) { const i = h('input', Object.assign({ type: 'number', name, autocomplete: 'off', step: 'any' }, opts)); if (opts.full) i.dataset.full='1'; return i; }
    function dateIn(name, opts = {}) { const i = h('input', Object.assign({ type: 'date', name, autocomplete: 'off' }, opts)); if (opts.full) i.dataset.full='1'; return i; }
    function emailIn(name, opts = {}) { const i = h('input', Object.assign({ type: 'email', name, autocomplete: 'email' }, opts)); if (opts.full) i.dataset.full='1'; return i; }
    function telIn(name, opts = {}) { const i = h('input', Object.assign({ type: 'tel', name, autocomplete: 'tel' }, opts)); if (opts.full) i.dataset.full='1'; return i; }
    function textareaIn(name, opts = {}) { const i = h('textarea', Object.assign({ name, rows: 3 }, opts)); if (opts.full) i.dataset.full='1'; return i; }
    function selectIn(name, options, opts = {}) {
        const s = h('select', Object.assign({ name }, opts), ...options.map(o => h('option', { value: o.v }, o.l)));
        if (opts.full) s.dataset.full = '1';
        return s;
    }
    function checkbox(name, label, opts = {}) {
        return h('label', { class: 'check' + (opts.detail ? ' with-detail' : '') },
            h('div', { class: 'row' },
                h('input', Object.assign({ type: 'checkbox', name }, opts.attrs || {})),
                h('span', null, label)),
            opts.detail || null);
    }
    function radioGroup(name, options) {
        return h('div', { class: 'radio-row' }, ...options.map(o =>
            h('label', null,
                h('input', { type: 'radio', name, value: o.v }),
                h('span', null, o.l))));
    }

    // US states + DC — backs the Section 1 `address_state` dropdown
    // (Phase 17 R3 telehealth-licensure gate). The patient's state of
    // residence determines whether the clinician is licensed to provide
    // care; the gate lives in functions/_lib/licensure.js and is enforced
    // at intake-submit, triage, and booking.
    const US_STATES = [
        { v: '', l: 'Select your state…' },
        { v: 'AL', l: 'Alabama' }, { v: 'AK', l: 'Alaska' }, { v: 'AZ', l: 'Arizona' },
        { v: 'AR', l: 'Arkansas' }, { v: 'CA', l: 'California' }, { v: 'CO', l: 'Colorado' },
        { v: 'CT', l: 'Connecticut' }, { v: 'DE', l: 'Delaware' }, { v: 'DC', l: 'District of Columbia' },
        { v: 'FL', l: 'Florida' }, { v: 'GA', l: 'Georgia' }, { v: 'HI', l: 'Hawaii' },
        { v: 'ID', l: 'Idaho' }, { v: 'IL', l: 'Illinois' }, { v: 'IN', l: 'Indiana' },
        { v: 'IA', l: 'Iowa' }, { v: 'KS', l: 'Kansas' }, { v: 'KY', l: 'Kentucky' },
        { v: 'LA', l: 'Louisiana' }, { v: 'ME', l: 'Maine' }, { v: 'MD', l: 'Maryland' },
        { v: 'MA', l: 'Massachusetts' }, { v: 'MI', l: 'Michigan' }, { v: 'MN', l: 'Minnesota' },
        { v: 'MS', l: 'Mississippi' }, { v: 'MO', l: 'Missouri' }, { v: 'MT', l: 'Montana' },
        { v: 'NE', l: 'Nebraska' }, { v: 'NV', l: 'Nevada' }, { v: 'NH', l: 'New Hampshire' },
        { v: 'NJ', l: 'New Jersey' }, { v: 'NM', l: 'New Mexico' }, { v: 'NY', l: 'New York' },
        { v: 'NC', l: 'North Carolina' }, { v: 'ND', l: 'North Dakota' }, { v: 'OH', l: 'Ohio' },
        { v: 'OK', l: 'Oklahoma' }, { v: 'OR', l: 'Oregon' }, { v: 'PA', l: 'Pennsylvania' },
        { v: 'RI', l: 'Rhode Island' }, { v: 'SC', l: 'South Carolina' }, { v: 'SD', l: 'South Dakota' },
        { v: 'TN', l: 'Tennessee' }, { v: 'TX', l: 'Texas' }, { v: 'UT', l: 'Utah' },
        { v: 'VT', l: 'Vermont' }, { v: 'VA', l: 'Virginia' }, { v: 'WA', l: 'Washington' },
        { v: 'WV', l: 'West Virginia' }, { v: 'WI', l: 'Wisconsin' }, { v: 'WY', l: 'Wyoming' },
    ];

    // ==========================================================
    // Section renderers. Each returns a card <div>.
    // ==========================================================
    const RENDER = {
        1: () => h('div', { class: 'card' },
            h('h2', null, 'Section 1 of 18'),
            h('h3', null, 'Patient Information'),
            h('p', { class: 'desc' }, 'A few essentials for the record. Most you can update later in your profile too.'),
            h('div', { class: 'grid-2' },
                field('Full legal name', textIn('full_name', { full: 1, autocomplete: 'name' })),
                field('Date of birth', dateIn('dob', { full: 1, autocomplete: 'bday' })),
                field('Phone', telIn('phone', { full: 1 })),
                field('Email', emailIn('email', { full: 1 })),
                field('State where you will be located for visits', selectIn('address_state', US_STATES, { full: 1 }), 'For telehealth, your clinician must be licensed in the state where you are physically located during the visit.'),
                field('Referred by', textIn('referred_by', { full: 1 })),
                field('Interpreter language (if needed)', textIn('interpreter_language', { full: 1 })),
            ),
            h('p', { class: 'subhead' }, 'Visit purpose'),
            h('div', { class: 'check-grid' },
                checkbox('is_second_opinion', 'This is a second opinion'),
                checkbox('recommended_surgery', 'Surgery has been recommended to me')),
            field('If surgery recommended, type', textIn('recommended_surgery_type', { full: 1 }))),

        2: () => h('div', { class: 'card' },
            h('h2', null, 'Section 2 of 18'),
            h('h3', null, 'Consent'),

            field('Do you feel safe at home?', radioGroup('safety_at_home', [
                { v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }, { v: 'prefer_not', l: 'Prefer not to say' }])),
            field('Childcare available when needed?', radioGroup('childcare', [
                { v: 'yes', l: 'Yes' }, { v: 'sometimes', l: 'Sometimes' }, { v: 'no', l: 'No' }, { v: 'na', l: 'Not applicable' }])),
            field('Education level', radioGroup('education_level', [
                { v: 'elementary', l: 'Elementary' }, { v: 'hs', l: 'High school' }, { v: 'college', l: 'College' }, { v: 'graduate', l: 'Graduate' }])),
            field('Insurance', radioGroup('insurance', [
                { v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }, { v: 'applying', l: 'Applying' }])),
            field('Insurance type (if yes)', textIn('insurance_type', { full: 1 }))),

        19: () => h('div', { class: 'card' },
            h('h2', null, 'Section 18 of 18'),
            h('h3', null, 'Review of Systems'),
            h('p', { class: 'desc' }, 'Check anything bothering you currently or recently.'),
            h('div', { class: 'check-grid' },
                checkbox('ros_fever_chills', 'Fever / chills'),
                checkbox('ros_weight_loss', 'Unintentional weight loss'),
                checkbox('ros_fatigue', 'Fatigue'),
                checkbox('ros_chest_pain', 'Chest pain'),
                checkbox('ros_sob', 'Shortness of breath'),
                checkbox('ros_palpitations', 'Palpitations'),
                checkbox('ros_abd_pain', 'Abdominal pain'),
                checkbox('ros_n_v', 'Nausea / vomiting'),
                checkbox('ros_change_bowel_habits', 'Change in bowel habits'),
                checkbox('ros_dysuria', 'Dysuria'),
                checkbox('ros_hematuria', 'Blood in urine'),
                checkbox('ros_urinary_frequency', 'Urinary frequency'),
                checkbox('ros_headaches', 'Headaches'),
                checkbox('ros_dizziness', 'Dizziness'),
                checkbox('ros_numbness_tingling', 'Numbness / tingling'),
                checkbox('ros_joint_pain', 'Joint pain'),
                checkbox('ros_leg_swelling', 'Leg swelling'),
                checkbox('ros_rash', 'Rash'),
                checkbox('ros_depression', 'Depression'),
                checkbox('ros_anxiety', 'Anxiety'),
                checkbox('ros_insomnia', 'Insomnia'))),
    };

    // ==========================================================
    // State + boot
    // ==========================================================
    let intakeId = null;
    let currentIdx = 0;
    const sectionData = {}; // { sectionNum: lastSavedData }
    const dirtyTimers = {}; // { sectionNum: timeoutId }
    const sectionEls = {};

    const form = document.getElementById('intakeForm');
    const tocList = document.getElementById('tocList');
    const pctBar = document.getElementById('pctBar');
    const pctLabel = document.getElementById('pctLabel');
    const banner = document.getElementById('banner');
    const saveStatus = document.getElementById('saveStatus');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    function showStatus(text, cls) {
        saveStatus.textContent = text;
        saveStatus.className = 'save-status show ' + (cls || '');
        clearTimeout(showStatus._t);
        showStatus._t = setTimeout(() => { saveStatus.className = 'save-status'; }, 2400);
    }

    function buildToc() {
        tocList.innerHTML = '';
        SECTIONS.forEach((s, i) => {
            const li = h('li', null,
                h('button', { type: 'button', onClick: () => goTo(i) },
                    h('span', { class: 'dot' }),
                    h('span', null, s.label)));
            tocList.appendChild(li);
        });
    }

    function buildSections() {
        SECTIONS.forEach((s) => {
            const panel = h('section', { class: 'panel', 'data-section': s.n });
            const card = RENDER[s.n] ? RENDER[s.n]() : h('div', { class: 'card' }, h('h3', null, s.label));
            panel.appendChild(card);
            form.appendChild(panel);
            sectionEls[s.n] = panel;
            panel.addEventListener('input', () => onSectionDirty(s.n));
            panel.addEventListener('change', () => onSectionDirty(s.n));
        });
    }

    function snapshotSection(n) {
        const panel = sectionEls[n];
        const out = {};
        panel.querySelectorAll('input, select, textarea').forEach((el) => {
            const name = el.name;
            if (!name) return;
            if (el.type === 'checkbox') out[name] = !!el.checked;
            else if (el.type === 'radio') { if (el.checked) out[name] = el.value; }
            else out[name] = el.value === '' ? null : el.value;
        });
        return out;
    }

    function hydrateSection(n, data) {
        if (!data) return;
        const panel = sectionEls[n];
        panel.querySelectorAll('input, select, textarea').forEach((el) => {
            const name = el.name;
            if (!name || !(name in data)) return;
            const v = data[name];
            if (el.type === 'checkbox') el.checked = !!v;
            else if (el.type === 'radio') el.checked = (el.value === String(v));
            else el.value = v == null ? '' : v;
        });
    }

    function setProgress(pct) {
        pctBar.style.width = (pct || 0) + '%';
        pctLabel.textContent = (pct || 0) + '%';
    }

    function markFilled(n) {
        const btn = tocList.children[SECTIONS.findIndex(s => s.n === n)]?.querySelector('button');
        if (btn) btn.parentElement.classList.add('done');
    }

    function setActiveIdx(i) {
        currentIdx = i;
        Array.from(form.children).forEach((el, idx) => {
            el.classList.toggle('active', idx === i);
        });
        Array.from(tocList.children).forEach((li, idx) => {
            li.querySelector('button').classList.toggle('active', idx === i);
            li.classList.toggle('active', idx === i);
        });
        prevBtn.disabled = i === 0;
        nextBtn.style.display = (i === SECTIONS.length - 1) ? 'none' : '';
        submitBtn.style.display = (i === SECTIONS.length - 1) ? '' : 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goTo(i) { setActiveIdx(Math.max(0, Math.min(SECTIONS.length - 1, i))); }

    async function onSectionDirty(n) {
        clearTimeout(dirtyTimers[n]);
        dirtyTimers[n] = setTimeout(() => saveSection(n), 800);
    }

    async function saveSection(n) {
        if (!intakeId) return;
        const snap = snapshotSection(n);
        if (JSON.stringify(snap) === JSON.stringify(sectionData[n] || {})) return;
        showStatus('Saving…');
        try {
            const r = await fetch(`/api/v1/patient/intake/${intakeId}/section/${n}`, {
                method: 'PATCH',
                credentials: 'same-origin',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(snap),
            });
            if (!r.ok) {
                if (r.status === 401) { location.href = '/portal/login/'; return; }
                if (r.status === 409) { showStatus('Intake already submitted', 'err'); return; }
                showStatus('Save failed', 'err');
                return;
            }
            const body = await r.json();
            sectionData[n] = snap;
            setProgress(body.completion_pct);
            markFilled(n);
            showStatus('Saved', 'ok');
        } catch (err) {
            showStatus('Network error', 'err');
        }
    }

    async function flushAll() {
        await Promise.all(SECTIONS.map(s => saveSection(s.n)));
    }

    async function doSubmit() {
        if (!intakeId) return;
        await flushAll();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting…';
        try {
            const r = await fetch(`/api/v1/patient/intake/${intakeId}/submit`, {
                method: 'POST', credentials: 'same-origin',
            });
            const body = await r.json().catch(() => ({}));
            if (r.ok) {
                banner.innerHTML = '';
                banner.appendChild(h('div', { class: 'banner ok' }, 'Intake submitted. The clinician and the office will review it before your visit.'));
                form.querySelectorAll('input, select, textarea').forEach(el => el.disabled = true);
                submitBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                prevBtn.disabled = true;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (r.status === 409 && body.error === 'consent_required') {
                showStatus('Please save the Consent section first', 'err');
                goTo(SECTIONS.findIndex(s => s.n === 2));
            } else {
                showStatus(body.message || 'Submit failed', 'err');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit intake';
            }
        } catch (err) {
            showStatus('Network error', 'err');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Submit intake';
        }
    }

    prevBtn.addEventListener('click', () => goTo(currentIdx - 1));
    nextBtn.addEventListener('click', () => goTo(currentIdx + 1));
    submitBtn.addEventListener('click', doSubmit);
    logoutBtn.addEventListener('click', async () => {
        await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
        location.href = '/portal/';
    });

    async function boot() {
        try {
            const me = await fetch('/api/v1/auth/me', { credentials: 'same-origin' });
            if (me.status === 401) { location.href = '/portal/login/'; return; }
            if (me.status === 404) { location.href = '/portal/'; return; }
            const r = await fetch('/api/v1/patient/intake/current', { credentials: 'same-origin' });
            const data = await r.json();

            buildToc();
            buildSections();

            if (data?.intake) {
                intakeId = data.intake.id;
                setProgress(data.intake.completion_pct || 0);
                if (data.intake.status !== 'in_progress') {
                    banner.innerHTML = '';
                    banner.appendChild(h('div', { class: 'banner ok' }, 'Your intake has been submitted. Open your profile to update editable fields.'));
                    form.querySelectorAll('input, select, textarea').forEach(el => el.disabled = true);
                    submitBtn.style.display = 'none';
                    nextBtn.style.display = 'none';
                    prevBtn.disabled = true;
                }
                for (const [n, payload] of Object.entries(data.sections || {})) {
                    sectionData[n] = payload.data || {};
                    hydrateSection(Number(n), payload.data || {});
                    markFilled(Number(n));
                }
            } else {
                const create = await fetch('/api/v1/patient/intake/new', {
                    method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: '{}',
                });
                const cb = await create.json();
                intakeId = cb.intake_id;
                setProgress(0);
            }
            setActiveIdx(0);
        } catch (err) {
            showStatus('Could not load intake', 'err');
        }
    }
    boot();
    </script>
</body>
</html>
